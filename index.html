<style>

*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}

const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);

function login(){view(`<div class="card"><h2>BLACKGHOST TATTOO STUDIO</h2><label>이메일</label><input id="em" type="email"><label>비밀번호 (6자 이상)</label><input id="pw" type="password">
<div class="row" style="margin-top:12px"><button class="p" onclick="doLogin()">로그인</button><button onclick="doSignup()">가입하기</button><button onclick="doReset()">비밀번호 재설정</button></div></div>`)}

const payOf=()=>{const t=f.type;return t=='normal'||t=='etc'?f.pay:t=='review'?(f.ch=='naver'&&!f.sep?'card':f.rp):'-'};
async function save(){const p=P(f.pid),t=f.type,pay=payOf(),d=(adm()&&f.d)||today(),u=(adm()&&f.uid)||me.id,et=t=='etc',rv=t=='review';

if(t=='service'&&!f.buyer.trim())return toast('받는 사람 이름을 입력하세요');

const rate=t=='normal'?cfg.rates[pay]:0,qty=et||rv?1:f.qty;
const done=await db.collection('sales').add({at:NOW(),d,uid:u,pid:et?'':f.pid,s:et?'':f.size,qty,t,ch:rv?f.ch:'',sub:rv?(f.ch=='naver'&&f.sep?'sep':'cream'):'',ap:t=='service'?(adm()?'ok':'pending'):'',pay:pay||'-',payer:rv&&pay=='transfer'?f.payer.trim():'',buyer:f.buyer,memo:f.memo.trim(),a,lp:et?0:p.pr.normal[f.size]*qty,rate,c:Math.round(a*rate/100),img:f.img,rid:f.rid.trim(),rn:f.rn.trim(),void:false,hist:[]}).then(()=>1).catch(err);

function pic(i){const fl=i.files[0];if(!fl)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,800/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f.img=c.toDataURL('image/jpeg',.6);draw()};im.src=URL.createObjectURL(fl)}
function setF(k,v){f[k]=v;if(['type','size','pid','ch','qty','sep'].includes(k))f.amt=null;if(['type','ch','sep'].includes(k))f.rp='';if(k=='ch')f.sep=false;draw()}
const seg=(k,o)=>'<div class="row">'+o.map(([v,l])=>`<button class="${f[k]==v?'on':''}" onclick="setF('${k}','${v}')">${l}</button>`).join('')+'</div>';
function form(){const p=P(f.pid),t=f.type,ad=adm(),pay=payOf(),au=aut(),nv=f.ch=='naver';
const tps=[['normal','정상판매'],['review','리뷰이벤트'],['service','서비스'],['sample','샘플']].concat(ad?[['etc','기타']]:[]);
const who=ad?`<label>판매자 (대신 입력)</label><select onchange="f.uid=this.value">${Object.values(users).filter(u=>u.status=='active').map(u=>`<option value="${u.id}" ${(f.uid||me.id)==u.id?'selected':''}>${nm(u.id)}</option>`).join('')}</select><label>판매 날짜</label><input type="date" value="${f.d||today()}" onchange="f.d=this.value">`:'';
const prod=`<label>제품 선택</label><select onchange="setF('pid',this.value)">${cfg.products.filter(x=>x.on).map(x=>`<option value="${x.id}" ${x.id==f.pid?'selected':''}>${x.name}</option>`).join('')}</select><label>대 / 소</label>${seg('size',[['L','대'],['S','소']])}`;
const qty=`<label>수량</label><input type="number" min="1" value="${f.qty}" onchange="setF('qty',Math.max(1,+this.value))">`;
const memo=lb=>`<label>${lb||'기타 내용'}</label><textarea rows="2" oninput="f.memo=this.value">${esc(f.memo)}</textarea>`;
const btn=(on,fn,tx)=>`<div class="row"><button class="${on?'on':''}" onclick="${fn}">${tx}</button></div>`;
let b='';
if(t=='normal')b=prod+qty+`<label>금액 (예외 시 직접 수정)</label><input type="number" value="${f.amt==null?au:f.amt}" oninput="f.amt=this.value"><label>결제방법</label>${seg('pay',Object.entries(PM))}<label>구매자 이름 (선택)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value">`+memo();
else if(t=='review'){b=`<label>리뷰 채널 (필수)</label>${seg('ch',[['naver','네이버'],['google','구글']])}`;

if(f.rp=='transfer'&&!(nv&&!f.sep))b+=`<label>입금자명 (필수)</label><input value="${esc(f.payer)}" oninput="f.payer=this.value">`;
if(!(nv&&f.sep))b+=`<label>리뷰 확인 (아이디 · 이름 · 이미지 중 하나는 필수)</label><input placeholder="리뷰 아이디" value="${esc(f.rid)}" oninput="f.rid=this.value" style="margin-bottom:6px"><input placeholder="리뷰 작성자 이름" value="${esc(f.rn)}" oninput="f.rn=this.value" style="margin-bottom:6px"><input type="file" accept="image/*" onchange="pic(this)">${f.img?'<div class="mu">✔ 이미지 첨부됨</div>':''}`;
b+=memo()}}
else if(t=='service')b=prod+qty+`<label>받는 사람 이름 (필수)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value">`+memo('서비스 내용')+'<p class="mu">'+(ad?'대장님 입력은 바로 반영돼요.':'대장님 승인 후 반영돼요.')+'</p>';
else if(t=='sample')b=prod+qty;
else b=`<label>항목 (필수)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value"><label>금액(원)</label><input type="number" value="${f.amt==null?'':f.amt}" oninput="f.amt=this.value"><label>결제방법</label>${seg('pay',Object.entries(PM))}`;
return `<div class="card"><h2>판매 입력</h2>${who}<label>유형</label>${seg('type',tps)}${b}${t=='normal'?`<p class="mu">판매수당율 ${cfg.rates[f.pay]}%</p>`:''}<button class="p" style="width:100%;margin-top:12px" onclick="save()">저장</button></div>`}
const pn=x=>x.t=='etc'?esc(x.buyer||'기타'):P(x.pid).name+' '+(x.s=='L'?'대':'소')+'×'+x.qty+(x.t=='service'&&x.buyer?' → '+esc(x.buyer):'');
const fmt=at=>at?new Date(at).toLocaleString('ko-KR',{hour12:false}):'(시간 기록 없음)';
const kvp=(title,rows,btns)=>{$('#mb').innerHTML=`<h2>${title}</h2><div class="tbl"><table>${rows.filter(r=>r[1]!==''&&r[1]!=null).map(([k,v])=>`<tr><th style="white-space:nowrap;vertical-align:top">${k}</th><td style="white-space:normal">${v}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:12px">${btns||''}<button onclick="$('#modal').style.display='none'">닫기</button></div>`;$('#modal').style.display='flex'};
function showSale(id){const x=allSales.find(s=>s.id==id);if(!x)return;const own=adm()||x.uid==me.id,h=(x.hist||[]).map(e=>fmt(e.at)+' · '+esc(e.by)+' · '+esc(e.chg||e.before||'')).join('<br>');
kvp('판매 상세',[['등록 시간',fmt(x.at)],['날짜',x.d],['판매자',nm(x.uid)],['유형',(T[x.t]||x.t)+(x.ch?' · '+(x.ch=='naver'?'네이버':'구글'):'')+(x.sub=='sep'?' · 별도결제':'')+(x.ap=='pending'?' · 승인대기':x.ap=='no'?' · 반려':'')],['제품',x.t=='etc'?'':P(x.pid).name+' '+(x.s=='L'?'대':'소')+' × '+x.qty],['금액',won(x.a)],['결제',PM[x.pay]||''],['입금자명',esc(x.payer)],[x.t=='service'?'받는 사람':x.t=='etc'?'항목':'구매자',esc(x.buyer)],['리뷰 아이디',esc(x.rid)],['리뷰 이름',esc(x.rn)],['이미지',x.img?`<img src="${x.img}" style="max-width:100%;border-radius:8px">`:''],['메모',esc(x.memo)],['판매수당',x.c?won(x.c)+' ('+x.rate+'%)':''],['수정 이력',h]],
(own?`<button class="p" onclick="edit('${x.id}')">수정</button>`:'')+(adm()&&x.ap=='pending'?`<button class="p" onclick="approve('${x.id}','ok');$('#modal').style.display='none'">승인</button><button onclick="approve('${x.id}','no');$('#modal').style.display='none'">반려</button>`:''))}

function supView(){const ad=adm(),l=sup.filter(x=>!x.void&&(supCat=='전체'||x.cat==supCat)),bad=x=>x=='정상'?'':'wa';
const head=`<div class="card"><h2>비품 · 소모품 현황</h2><div class="row">${['전체',...SC].map(c=>`<button class="${supCat==c?'on':''}" onclick="supCat='${c}';draw()">${c}</button>`).join('')}</div><div class="tbl" style="margin-top:10px"><table><tr><th>분류</th><th>품목</th><th>재고</th><th>상태</th><th>메모</th><th></th></tr>${l.map(x=>ad?`<tr><td>${x.cat}</td><td>${esc(x.name)}</td><td><input type="number" style="width:70px" value="${x.qty}" onchange="updSup('${x.id}','qty',this.value)"></td><td><select style="width:100px" onchange="updSup('${x.id}','status',this.value)">${SS.map(s2=>`<option ${s2==x.status?'selected':''}>${s2}</option>`).join('')}</select></td><td>${esc(x.memo)}</td><td><button onclick="updSup('${x.id}','void',true)">삭제</button></td></tr>`:`<tr><td>${x.cat}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td class="${bad(x.status)}">${x.status}</td><td>${esc(x.memo)}</td><td><button onclick="rq.i='${x.id}';draw()">요청</button></td></tr>`).join('')||'<tr><td>등록된 품목이 없어요</td></tr>'}</table></div></div>`;
if(ad)return head+`<div class="card"><h2>품목 추가</h2><label>분류</label><select id="p_c">${SC.map(c=>`<option>${c}</option>`).join('')}</select><label>품목 이름</label><input id="p_n"><label>재고 수량</label><input id="p_q" type="number" value="0"><label>상태</label><select id="p_s">${SS.map(c=>`<option>${c}</option>`).join('')}</select><label>메모</label><input id="p_m"><button class="p" style="width:100%;margin-top:12px" onclick="addSup()">추가</button></div><div class="card"><h2>요청 목록</h2><div class="tbl"><table><tr><th>날짜</th><th>요청자</th><th>품목</th><th>수량</th><th>메모</th><th>상태</th><th></th></tr>${sreq.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${nm(x.uid)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${esc(x.memo)}</td><td>${RS[x.st]}</td><td>${x.st=='pending'?`<button class="p" onclick="supSt('${x.id}','ok')">승인</button><button onclick="supSt('${x.id}','no')">반려</button>`:x.st=='ok'?`<button class="p" onclick="supSt('${x.id}','done')">완료</button>`:''}</td></tr>`).join('')||'<tr><td>요청이 없어요</td></tr>'}</table></div></div>`;
return head+`<div class="card"><h2>요청하기</h2><label>품목</label><select onchange="rq.i=this.value;draw()"><option value="">직접 입력</option>${sup.filter(x=>!x.void).map(x=>`<option value="${x.id}" ${rq.i==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${rq.i?'':`<label>품목 이름 (목록에 없는 경우)</label><input value="${esc(rq.n)}" oninput="rq.n=this.value">`}<label>수량</label><input type="number" min="1" value="${rq.q}" oninput="rq.q=this.value"><label>메모</label><textarea rows="2" oninput="rq.m=this.value">${esc(rq.m)}</textarea><button class="p" style="width:100%;margin-top:12px" onclick="reqSup()">요청 보내기</button></div><div class="card"><h2>내 요청</h2><div class="tbl"><table><tr><th>날짜</th><th>품목</th><th>수량</th><th>상태</th></tr>${sreq.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${RS[x.st]}</td></tr>`).join('')||'<tr><td>요청 내역이 없어요</td></tr>'}</table></div></div>`}
// ----- notices
async function postNotice(){const t=$('#n_t').value.trim(),b=$('#n_b').value.trim();if(!t)return toast('제목을 입력하세요');const done=await db.collection('notices').add({at:NOW(),title:t,body:b,d:today(),at:new Date().toISOString(),void:false}).then(()=>1).catch(err);if(!done)return;await loadNotices();draw()}
async function voidNotice(id,v){await db.doc('notices/'+id).update({void:v}).catch(err);await loadNotices();draw()}
function noticeCard(){return `<div class="card"><h2>공지사항 작성</h2><p class="mu">등록하면 타투이스트가 앱을 열 때 팝업으로 한 번 보이고, 내현황 위에도 계속 표시돼요.</p><label>제목</label><input id="n_t"><label>내용</label><textarea id="n_b" rows="4"></textarea><button class="p" style="width:100%;margin-top:12px" onclick="postNotice()">공지 등록</button><div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>제목</th><th></th></tr>${notices.slice(0,15).map(x=>`<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(2)}</td><td>${esc(x.title)}</td><td><button onclick="voidNotice('${x.id}',${!x.void})">${x.void?'복구':'삭제'}</button></td></tr>`).join('')}</table></div></div>`}
function showNotice(){let seen=[];try{seen=JSON.parse(localStorage.getItem('seenN')||'[]')}catch(e){}const nw=nl().filter(x=>!seen.includes(x.id));if(!nw.length)return;
$('#mb').innerHTML='<h2>📢 공지사항</h2>'+nw.slice(0,3).map(x=>`<div style="margin-bottom:10px"><b>${esc(x.title)}</b><div style="white-space:pre-wrap">${esc(x.body)}</div></div>`).join('')+'<button class="p" style="width:100%" onclick="ackNotice()">확인</button>';$('#modal').style.display='flex'}
function ackNotice(){try{localStorage.setItem('seenN',JSON.stringify(nl().map(x=>x.id)))}catch(e){}$('#modal').style.display='none'}
function greet(){const sf=smf(me),since=me.since||(sf[0]&&sf[0].m+'-01'),days=since?Math.floor((new Date(today())-new Date(since))/864e5)+1:0,lv=days>0?Math.min(10,1+Math.floor((days-1)/365)):0;return `<div class="card"><b>${esc(me.nick||me.name)}님 오늘도 화이팅! 💪</b>${days>0?`<div class="mu">블랙고스트와 ${days}일째 · Lv.${lv}</div>`:''}</div>`}
let busy=false;const typing=()=>['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName);
async function loadUsers(){const q=await db.collection('users').get();users={};q.forEach(d=>users[d.id]={id:d.id,...d.data()})}
async function refresh(){if(!me||busy)return;busy=true;try{if(adm()){await loadUsers();await loadBuys()}else await loadMySP();await loadRoster();await loadSales();await loadToss();await loadSup();await loadNotices();await loadSettle()}catch(e){console.log(e)}busy=false}
function startAuto(){if(window._au)return;const go2=()=>{if(document.hidden||$('#modal').style.display=='flex'||typing())return;refresh().then(()=>{if(!typing()&&$('#modal').style.display!='flex')draw()})};window._au=setInterval(go2,45000);document.addEventListener('visibilitychange',go2)}
function draw(){const ad=adm(),tabs=ad?[['home','총괄'],['in','판매입력'],['toss','토스'],['sup','비품·소모품'],['share','쉐어비'],['set','정산'],['inv','재고·마진'],['conf','설정']]:[['home','내현황'],['in','판매입력'],['toss','토스'],['sup','비품·소모품'],['share','쉐어비']];
view((ad?'':greet())+`<div class="card row"><b>BLACKGHOST TATTOO STUDIO</b><span class="mu" style="margin-left:auto">v12</span><button onclick="out()">로그아웃</button></div><div class="tabs row" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`+
(tab=='in'?form():tab=='toss'?tossView():tab=='sup'?supView():tab=='set'&&ad?settle():tab=='share'?(ad?share():shareMe()):tab=='conf'&&ad?conf()+noticeCard():tab=='inv'&&ad?inv():home()))}
</script></body></html>
