label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}.wa{color:var(--wa)}

.hi{font-size:18px;font-weight:700;margin-top:6px}

@media (max-width:680px){.tbl.rs{overflow:visible}.tbl.rs table,.tbl.rs tbody,.tbl.rs tr,.tbl.rs td{display:block;width:100%}.tbl.rs tr.hd{display:none}.tbl.rs tr{border:1px solid var(--ln);border-radius:12px;padding:6px 10px;margin:8px 0;background:var(--bg)}.tbl.rs td{display:flex;gap:10px;justify-content:space-between;align-items:center;border:0;padding:4px 0;white-space:normal;text-align:right}.tbl.rs td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left;flex:0 0 auto}.tbl.rs td[data-l=""]::before{display:none}.tbl.rs td[data-l=""]{justify-content:flex-end}}

.nav button.on{background:var(--soft);color:var(--ac)}.nav i,.grid i{font-style:normal;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.grid button{padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tk{display:inline-block;margin:4px;padding:14px 16px;border-radius:12px;border:1px dashed var(--ac);background:var(--soft)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}#modal>div{max-height:90vh;overflow:auto;width:100%;max-width:440px}

<script>
firebase.initializeApp({apiKey:"AIzaSyBTqRIfhUzlsO2YOfaEBlMHWGlLW-R44Z4",authDomain:"tattoo-cream-ecacc.firebaseapp.com",projectId:"tattoo-cream-ecacc",storageBucket:"tattoo-cream-ecacc.firebasestorage.app",messagingSenderId:"692684499045",appId:"1:692684499045:web:c3a10ae76dd8ff418cfe8c"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);

let me,cfg=DEF,users={},sales=[],tab='in',month=today().slice(0,7),setMonth='',f={pid:'p1',size:'L',qty:1,type:'normal',pay:'card',ch:'',sub:'cream',rp:'',sep:false,payer:'',rn:'',memo:'',rid:'',buyer:'',amt:null,img:''};

const toast=m=>{alert(m)},err=e=>toast('오류: '+(e.message||e));
const price=(p,t,s,ch)=>t=='normal'?p.pr.normal[s]:t=='review'?p.pr.review[s]:t=='svcreview'&&ch=='naver'?100:0;
let allSales=[],buys=[],cnts=[],cashs=[],sp=[],tosses=[],notices=[],tf={mode:'all',m:today().slice(0,7),a:'',b:'',q:''};
const foldOpen={};
function cardify(){if(!document.querySelectorAll)return;document.querySelectorAll('#app .tbl').forEach(w=>{const t=w.querySelector('table');if(!t)return;const rows=[...t.rows],h=rows.find(r=>r.querySelector('th'));if(!h)return;const ls=[...h.cells].map(c=>c.textContent.trim());h.classList.add('hd');w.classList.add('rs');rows.forEach(r=>{if(r===h)return;[...r.cells].forEach((c,i)=>{if(c.colSpan>1)return;c.setAttribute('data-l',ls[i]||'')})})});document.querySelectorAll('#app .fold').forEach(c=>{const k=c.querySelector('h2').textContent.trim();if(foldOpen[k])c.classList.add('open')})}

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function applyTheme(){const t=lsGet('theme')||'auto',r=document.documentElement;if(!r||!r.setAttribute)return;if(t=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
function setTheme(t){try{localStorage.setItem('theme',t)}catch(e){}applyTheme();if(me)draw();else login()}
const themeBar=()=>`<div class="row">${[['auto','자동 (기기 설정)'],['light','밝게'],['dark','어둡게']].map(([k,l])=>`<button class="${(lsGet('theme')||'auto')==k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>`;
applyTheme();
function login(){view(`<div class="card"><h2>BLACKGHOST TATTOO STUDIO</h2><label>이메일</label><input id="em" type="email"><label>비밀번호 (6자 이상)</label><input id="pw" type="password">
<div class="row" style="margin-top:12px"><button class="p" onclick="doLogin()">로그인</button><button onclick="doSignup()">가입하기</button><button onclick="doReset()">비밀번호 재설정</button></div></div><div class="card"><h2>화면 테마</h2>${themeBar()}</div>`)}
const doLogin=()=>auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(err);
const doSignup=()=>auth.createUserWithEmailAndPassword($('#em').value,$('#pw').value).then(c=>c.user.sendEmailVerification()).catch(err);

const out=()=>auth.signOut();
const gate=(t,body)=>view(`<div class="card"><h2>${t}</h2>${body}<div class="row" style="margin-top:12px"><button onclick="location.reload()">새로고침</button><button onclick="out()">로그아웃</button></div></div>`);
auth.onAuthStateChanged(async u=>{if(!u)return login();try{await boot(u)}catch(e){gate('오류가 났어요','<p>'+(e.message||e)+'</p><p class="mu">보안 규칙이 게시됐는지 확인하세요.</p>')}});
async function boot(u){await u.reload();await u.getIdToken(true);
if(!u.emailVerified)return gate('이메일 인증이 필요해요','<p>'+u.email+'로 보낸 인증 메일의 링크를 누른 뒤 새로고침하세요. 메일이 안 오면 스팸함을 확인하세요.</p>');
const s=await db.doc('users/'+u.uid).get();
if(!s.exists)return gate('가입 정보 입력',`<label>이름</label><input id="nn"><label>닉네임 (앱에 표시돼요)</label><input id="nk"><label>가입 구분</label><select id="kd"><option value="artist">타투이스트 (쉐어)</option><option value="student">수강생</option></select><label>수강생이면 기수 (예: 12)</label><input id="ch"><label>가게 가입코드</label><input id="cd"><button class="p" style="margin-top:12px" onclick="mkProfile('${u.uid}','${u.email}')">신청</button>`);
me={id:u.uid,...s.data()};if(me.status=='disabled')return gate('비활성 계정','<p>대장님께 문의하세요.</p>');
if(me.status!='active')return gate('승인 대기 중','<p>대장님이 승인하면 사용할 수 있어요.</p>');
if(me.role!='student'){const c=await db.doc('config/main').get();if(c.exists)cfg=c.data()}
if(adm()){const us=await db.collection('users').get();us.forEach(d=>users[d.id]={id:d.id,...d.data()});await loadBuys()}
if(me.role=='student'){await loadNotices();await loadAcad();tab='home';draw();showNotice();startAuto();return}await loadSales();await loadRoster();await loadToss();await loadEvents();if(isInst())await loadAcad();await loadNotices();await loadSup();await loadSettle();if(!adm())await loadMySP();else await syncRoster();tab='home';draw();showNotice();startAuto()}
function mkProfile(id,email){db.doc('users/'+id).set({name:$('#nn').value.trim(),nick:$('#nk').value.trim(),want:$('#kd').value,cohort:$('#ch').value.trim(),email,role:'artist',status:'pending',code:$('#cd').value.trim()}).then(()=>location.reload()).catch(()=>toast('가입코드가 맞지 않아요'))}
async function loadSales(){const s=await(adm()?db.collection('sales'):db.collection('sales').where('uid','==',me.id)).get();const a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));a.sort((x,y)=>tk(y)<tk(x)?-1:1);allSales=a;sales=a.filter(x=>inP(x.d))}
async function loadBuys(){const s=await db.collection('purchases').get();buys=[];s.forEach(d=>buys.push({id:d.id,...d.data()}));buys.sort((a,b)=>tk(b)<tk(a)?-1:1);const A=async(n,t)=>{const q=await db.collection(n).get(),r=[];q.forEach(d=>r.push({id:d.id,...d.data()}));return r.sort((a,b)=>tk(b)<tk(a)?-1:1)};cnts=await A('counts');cashs=await A('cash');await loadLedger();await loadGuests()}
const ok=x=>!x.void&&x.ap!='pending'&&x.ap!='no';const live=()=>sales.filter(ok);
const cmOf=(p,key)=>(p.cm&&p.cm[key])||{t:'pct',pct:key=='cash'?(cfg.rates.cash||0):key=='card'?(cfg.rates.card||0):0,L:0,S:0};
function comm(p,t,pay,size,qty,a){if(t!='normal'&&t!='review')return{c:0,rate:0,u:null};const m=cmOf(p,t=='review'?'review':pay=='card'?'card':'cash');if(m.t=='amt'){const u=+m[size]||0;return{c:u*qty,rate:0,u}}return{c:Math.round(a*(m.pct||0)/100),rate:m.pct||0,u:null}}
const aut=()=>{const p=P(f.pid),t=f.type;return t=='normal'?p.pr.normal[f.size]*f.qty:t=='review'?(f.ch=='naver'&&f.sep?100:f.ch?p.pr.review[f.size]:0):0};
const payOf=()=>{const t=f.type;return t=='normal'||t=='etc'?f.pay:t=='review'?(f.ch=='naver'&&!f.sep?'card':f.rp):'-'};
async function save(){const p=P(f.pid),t=f.type,pay=payOf(),d=(adm()&&f.d)||today(),u=(adm()&&f.uid)||me.id,et=t=='etc',rv=t=='review';
if(et&&!adm())return toast('기타는 대장님만 입력할 수 있어요');
const a=(t=='normal'||et)&&f.amt!=null&&f.amt!==''?+f.amt:aut();
if(rv){if(!f.ch)return toast('리뷰 채널을 선택하세요');if(!pay)return toast('결제방법을 선택하세요');if(pay=='transfer'&&!f.payer.trim())return toast('입금자명을 입력하세요');
if(!(f.ch=='naver'&&f.sep)&&!f.rid.trim()&&!f.rn.trim()&&!f.img)return toast('리뷰 아이디, 이름, 이미지 중 하나는 꼭 입력하세요')}
if(t=='service'&&!f.buyer.trim())return toast('받는 사람 이름을 입력하세요');
if(et&&(!f.buyer.trim()||f.amt==null||f.amt===''))return toast('항목과 금액을 입력하세요');
const qty=et||rv?1:f.qty,cm=et?{c:0,rate:0,u:null}:comm(p,t,pay,f.size,qty,a);
const done=await db.collection('sales').add({at:NOW(),d,uid:u,pid:et?'':f.pid,s:et?'':f.size,qty,t,ch:rv?f.ch:'',sub:rv?(f.ch=='naver'&&f.sep?'sep':'cream'):'',ap:t=='service'?(adm()?'ok':'pending'):'',pay:pay||'-',payer:rv&&pay=='transfer'?f.payer.trim():'',buyer:f.buyer,memo:f.memo.trim(),a,lp:et?0:p.pr.normal[f.size]*qty,rate:cm.rate,unit:cm.u,c:cm.c,img:f.img,rid:f.rid.trim(),rn:f.rn.trim(),void:false,hist:[]}).then(()=>1).catch(err);
if(!done)return;Object.assign(f,{amt:null,buyer:'',rid:'',rn:'',img:'',memo:'',payer:'',sep:false,rp:'',d:'',uid:''});pf.mode='m';pf.m=d.slice(0,7);tab='home';await loadSales();draw()}
function pic(i){const fl=i.files[0];if(!fl)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,800/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f.img=c.toDataURL('image/jpeg',.6);draw()};im.src=URL.createObjectURL(fl)}
function setF(k,v){f[k]=v;if(['type','size','pid','ch','qty','sep'].includes(k))f.amt=null;if(['type','ch','sep'].includes(k))f.rp='';if(k=='ch')f.sep=false;draw()}

const who=ad?`<label>판매자 (대신 입력)</label><select onchange="f.uid=this.value">${Object.values(users).filter(u=>u.status=='active'&&u.role!='student').map(u=>`<option value="${u.id}" ${(f.uid||me.id)==u.id?'selected':''}>${nm(u.id)}</option>`).join('')}</select><label>판매 날짜</label><input type="date" value="${f.d||today()}" onchange="f.d=this.value">`:'';

b+=nv&&!f.sep?'<p class="mu">네이버 리뷰는 영수증 인증이 필요해서 카드결제만 가능해요.</p>':`<label>${nv?'별도결제 방법':'결제방법'} (필수)</label>${seg('rp',nv?[['cash','현금'],['transfer','이체']]:Object.entries(PM))}`;
if(f.rp=='transfer'&&!(nv&&!f.sep))b+=`<label>입금자명 (필수)</label><input value="${esc(f.payer)}" oninput="f.payer=this.value">`;
if(!(nv&&f.sep))b+=`<label>리뷰 확인 (아이디 · 이름 · 이미지 중 하나는 필수)</label><input placeholder="리뷰 아이디" value="${esc(f.rid)}" oninput="f.rid=this.value" style="margin-bottom:6px"><input placeholder="리뷰 작성자 이름" value="${esc(f.rn)}" oninput="f.rn=this.value" style="margin-bottom:6px"><input type="file" accept="image/*" onchange="pic(this)">${f.img?'<div class="mu">✔ 이미지 첨부됨</div>':''}`;
b+=memo()}}
else if(t=='service')b=prod+qty+`<label>받는 사람 이름 (필수)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value">`+memo('서비스 내용')+'<p class="mu">'+(ad?'대장님 입력은 바로 반영돼요.':'대장님 승인 후 반영돼요.')+'</p>';
