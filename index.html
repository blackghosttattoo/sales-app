<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACKGHOST TATTOO STUDIO</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#77756f;--ac:#1f6f5c;--ln:#e4e1da;--wa:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#eeece6;--mu:#9c9a93;--ac:#4fb59b;--ln:#363633;--wa:#e08a50}}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th,.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}.wa{color:var(--wa)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:10px;padding:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px}#modal>div{max-height:90vh;overflow:auto;width:100%;max-width:420px}
</style></head><body><main id="app">불러오는 중…</main><div id="modal"><div class="card" id="mb"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBTqRIfhUzlsO2YOfaEBlMHWGlLW-R44Z4",authDomain:"tattoo-cream-ecacc.firebaseapp.com",projectId:"tattoo-cream-ecacc",storageBucket:"tattoo-cream-ecacc.firebasestorage.app",messagingSenderId:"692684499045",appId:"1:692684499045:web:c3a10ae76dd8ff418cfe8c"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);
const T={normal:'정상판매',review:'리뷰이벤트',bundled:'작업비 포함(무료)',service:'서비스',svcreview:'서비스+리뷰(구)',sample:'샘플',etc:'기타'},PM={cash:'현금',card:'카드',transfer:'이체'};
const today=()=>new Date().toLocaleDateString('sv'),won=n=>(n||0).toLocaleString()+'원';
const DEF={rates:{cash:20,card:0,transfer:20},paid:{},closed:{},products:[{id:'p1',name:'허니구',on:1,pr:{normal:{S:5000,L:10000},review:{S:1000,L:5000}},base:{S:0,L:0}}]};
let me,cfg=DEF,users={},sales=[],tab='in',month=today().slice(0,7),setMonth='',f={pid:'p1',size:'L',qty:1,type:'normal',pay:'card',ch:'',sub:'cream',rp:'',sep:false,payer:'',rn:'',memo:'',rid:'',buyer:'',amt:null,img:''};
const adm=()=>me&&me.role=='admin',P=id=>cfg.products.find(p=>p.id==id)||{name:'?',pr:{normal:{},review:{}},base:{}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>{const u=users[id]||roster[id];return u?esc(u.nick||u.name)+(u.status=='disabled'?'(비활성)':''):id=='admin'?'대장':(me&&id==me.id?esc(me.nick||me.name):'?')};
const toast=m=>{alert(m)},err=e=>toast('오류: '+(e.message||e));
const price=(p,t,s,ch)=>t=='normal'?p.pr.normal[s]:t=='review'?p.pr.review[s]:t=='svcreview'&&ch=='naver'?100:0;
let allSales=[],buys=[],cnts=[],cashs=[],sp=[],tosses=[],notices=[],tf={mode:'all',m:today().slice(0,7),a:'',b:'',q:''};
function view(h){$('#app').innerHTML=h}
function login(){view(`<div class="card"><h2>BLACKGHOST TATTOO STUDIO</h2><label>이메일</label><input id="em" type="email"><label>비밀번호 (6자 이상)</label><input id="pw" type="password">
<div class="row" style="margin-top:12px"><button class="p" onclick="doLogin()">로그인</button><button onclick="doSignup()">가입하기</button><button onclick="doReset()">비밀번호 재설정</button></div></div>`)}
const doLogin=()=>auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(err);
const doSignup=()=>auth.createUserWithEmailAndPassword($('#em').value,$('#pw').value).then(c=>c.user.sendEmailVerification()).catch(err);
const doReset=()=>auth.sendPasswordResetEmail($('#em').value).then(()=>toast('재설정 메일을 보냈어요')).catch(err);
const out=()=>auth.signOut();
const gate=(t,body)=>view(`<div class="card"><h2>${t}</h2>${body}<div class="row" style="margin-top:12px"><button onclick="location.reload()">새로고침</button><button onclick="out()">로그아웃</button></div></div>`);
auth.onAuthStateChanged(async u=>{if(!u)return login();try{await boot(u)}catch(e){gate('오류가 났어요','<p>'+(e.message||e)+'</p><p class="mu">보안 규칙이 게시됐는지 확인하세요.</p>')}});
async function boot(u){await u.reload();await u.getIdToken(true);
if(!u.emailVerified)return gate('이메일 인증이 필요해요','<p>'+u.email+'로 보낸 인증 메일의 링크를 누른 뒤 새로고침하세요. 메일이 안 오면 스팸함을 확인하세요.</p>');
const s=await db.doc('users/'+u.uid).get();
if(!s.exists)return gate('가입 정보 입력',`<label>이름</label><input id="nn"><label>닉네임 (앱에 표시돼요)</label><input id="nk"><label>가게 가입코드</label><input id="cd"><button class="p" style="margin-top:12px" onclick="mkProfile('${u.uid}','${u.email}')">신청</button>`);
me={id:u.uid,...s.data()};if(me.status=='disabled')return gate('비활성 계정','<p>대장님께 문의하세요.</p>');
if(me.status!='active')return gate('승인 대기 중','<p>대장님이 승인하면 사용할 수 있어요.</p>');
const c=await db.doc('config/main').get();if(c.exists)cfg=c.data();
if(adm()){const us=await db.collection('users').get();us.forEach(d=>users[d.id]={id:d.id,...d.data()});await loadBuys()}
await loadSales();await loadRoster();await loadToss();await loadNotices();await loadSup();if(!adm())await loadMySP();else await syncRoster();tab='home';draw();showNotice()}
function mkProfile(id,email){db.doc('users/'+id).set({name:$('#nn').value.trim(),nick:$('#nk').value.trim(),email,role:'artist',status:'pending',code:$('#cd').value.trim()}).then(()=>location.reload()).catch(()=>toast('가입코드가 맞지 않아요'))}
async function loadSales(){const s=await(adm()?db.collection('sales'):db.collection('sales').where('uid','==',me.id)).get();const a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));allSales=a;sales=a.filter(x=>x.d.startsWith(month));sales.sort((x,y)=>y.d<x.d?-1:1)}
async function loadBuys(){const s=await db.collection('purchases').get();buys=[];s.forEach(d=>buys.push({id:d.id,...d.data()}));buys.sort((a,b)=>b.d<a.d?-1:1);const A=async(n,t)=>{const q=await db.collection(n).get(),r=[];q.forEach(d=>r.push({id:d.id,...d.data()}));return r.sort((a,b)=>b.d<a.d?-1:1)};cnts=await A('counts');cashs=await A('cash');sp=await A('sharepay')}
const ok=x=>!x.void&&x.ap!='pending'&&x.ap!='no';const live=()=>sales.filter(ok);
const aut=()=>{const p=P(f.pid),t=f.type;return t=='normal'?p.pr.normal[f.size]*f.qty:t=='review'?(f.ch=='naver'&&f.sep?100:f.ch?p.pr.review[f.size]:0):0};
const payOf=()=>{const t=f.type;return t=='normal'||t=='etc'?f.pay:t=='review'?(f.ch=='naver'&&!f.sep?'card':f.rp):'-'};
async function save(){const p=P(f.pid),t=f.type,pay=payOf(),d=(adm()&&f.d)||today(),u=(adm()&&f.uid)||me.id,et=t=='etc',rv=t=='review';if(cfg.closed[d.slice(0,7)])return toast('마감된 달입니다');
if(et&&!adm())return toast('기타는 대장님만 입력할 수 있어요');
const a=(t=='normal'||et)&&f.amt!=null&&f.amt!==''?+f.amt:aut();
if(rv){if(!f.ch)return toast('리뷰 채널을 선택하세요');if(!pay)return toast('결제방법을 선택하세요');if(pay=='transfer'&&!f.payer.trim())return toast('입금자명을 입력하세요');
if(!(f.ch=='naver'&&f.sep)&&!f.rid.trim()&&!f.rn.trim()&&!f.img)return toast('리뷰 아이디, 이름, 이미지 중 하나는 꼭 입력하세요')}
if(t=='service'&&!f.buyer.trim())return toast('받는 사람 이름을 입력하세요');
if(et&&(!f.buyer.trim()||f.amt==null||f.amt===''))return toast('항목과 금액을 입력하세요');
const rate=t=='normal'?cfg.rates[pay]:0,qty=et||rv?1:f.qty;
const done=await db.collection('sales').add({d,uid:u,pid:et?'':f.pid,s:et?'':f.size,qty,t,ch:rv?f.ch:'',sub:rv?(f.ch=='naver'&&f.sep?'sep':'cream'):'',ap:t=='service'?(adm()?'ok':'pending'):'',pay:pay||'-',payer:rv&&pay=='transfer'?f.payer.trim():'',buyer:f.buyer,memo:f.memo.trim(),a,lp:et?0:p.pr.normal[f.size]*qty,rate,c:Math.round(a*rate/100),img:f.img,rid:f.rid.trim(),rn:f.rn.trim(),void:false,hist:[]}).then(()=>1).catch(err);
if(!done)return;Object.assign(f,{amt:null,buyer:'',rid:'',rn:'',img:'',memo:'',payer:'',sep:false,rp:'',d:'',uid:''});month=d.slice(0,7);tab='home';await loadSales();draw()}
function pic(i){const fl=i.files[0];if(!fl)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,800/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f.img=c.toDataURL('image/jpeg',.6);draw()};im.src=URL.createObjectURL(fl)}
function setF(k,v){f[k]=v;if(['type','size','pid','ch','qty','sep'].includes(k))f.amt=null;if(['type','ch','sep'].includes(k))f.rp='';if(k=='ch')f.sep=false;draw()}
const seg=(k,o)=>'<div class="row">'+o.map(([v,l])=>`<button class="${f[k]==v?'on':''}" onclick="setF('${k}','${v}')">${l}</button>`).join('')+'</div>';
function form(){const p=P(f.pid),t=f.type,ad=adm(),pay=payOf(),au=aut(),nv=f.ch=='naver';
const tps=[['normal','정상판매'],['review','리뷰이벤트'],['service','서비스'],['sample','샘플']].concat(ad?[['etc','기타']]:[]);
const who=ad?`<label>판매자 (대신 입력)</label><select onchange="f.uid=this.value">${Object.values(users).filter(u=>u.status=='active').map(u=>`<option value="${u.id}" ${(f.uid||me.id)==u.id?'selected':''}>${nm(u.id)}</option>`).join('')}</select><label>판매 날짜</label><input type="date" value="${f.d||today()}" onchange="f.d=this.value">`:'';
const prod=`<label>제품 선택</label><select onchange="setF('pid',this.value)">${cfg.products.filter(x=>x.on).map(x=>`<option value="${x.id}" ${x.id==f.pid?'selected':''}>${x.name}</option>`).join('')}</select><label>대 / 소</label>${seg('size',[['L','대'],['S','소']])}`;
const qty=`<label>수량</label><input type="number" min="1" value="${f.qty}" onchange="setF('qty',Math.max(1,+this.value))">`;
const memo=lb=>`<label>${lb||'기타 내용'}</label><textarea rows="2" oninput="f.memo=this.value">${esc(f.memo)}</textarea>`;
const btn=(on,fn,tx)=>`<div class="row"><button class="${on?'on':''}" onclick="${fn}">${tx}</button></div>`;
let b='';
if(t=='normal')b=prod+qty+`<label>금액 (예외 시 직접 수정)</label><input type="number" value="${f.amt==null?au:f.amt}" oninput="f.amt=this.value"><label>결제방법</label>${seg('pay',Object.entries(PM))}<label>구매자 이름 (선택)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value">`+memo();
else if(t=='review'){b=`<label>리뷰 채널 (필수)</label>${seg('ch',[['naver','네이버'],['google','구글']])}`;
if(f.ch){b+=prod+`<label>금액 (자동 · 1인 1구매)</label><input type="number" disabled value="${au}">`;
if(nv)b+=`<label>크림 별도결제</label>`+btn(f.sep,`setF('sep',${!f.sep})`,f.sep?'✔ 별도결제 (100원 영수증)':'별도결제 체크');
b+=nv&&!f.sep?'<p class="mu">네이버 리뷰는 영수증 인증이 필요해서 카드결제만 가능해요.</p>':`<label>${nv?'별도결제 방법':'결제방법'} (필수)</label>${seg('rp',nv?[['cash','현금'],['transfer','이체']]:Object.entries(PM))}`;
if(f.rp=='transfer'&&!(nv&&!f.sep))b+=`<label>입금자명 (필수)</label><input value="${esc(f.payer)}" oninput="f.payer=this.value">`;
if(!(nv&&f.sep))b+=`<label>리뷰 확인 (아이디 · 이름 · 이미지 중 하나는 필수)</label><input placeholder="리뷰 아이디" value="${esc(f.rid)}" oninput="f.rid=this.value" style="margin-bottom:6px"><input placeholder="리뷰 작성자 이름" value="${esc(f.rn)}" oninput="f.rn=this.value" style="margin-bottom:6px"><input type="file" accept="image/*" onchange="pic(this)">${f.img?'<div class="mu">✔ 이미지 첨부됨</div>':''}`;
b+=memo()}}
else if(t=='service')b=prod+qty+`<label>받는 사람 이름 (필수)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value">`+memo('서비스 내용')+'<p class="mu">'+(ad?'대장님 입력은 바로 반영돼요.':'대장님 승인 후 반영돼요.')+'</p>';
else if(t=='sample')b=prod+qty;
else b=`<label>항목 (필수)</label><input value="${esc(f.buyer)}" oninput="f.buyer=this.value"><label>금액(원)</label><input type="number" value="${f.amt==null?'':f.amt}" oninput="f.amt=this.value"><label>결제방법</label>${seg('pay',Object.entries(PM))}`;
return `<div class="card"><h2>판매 입력</h2>${who}<label>유형</label>${seg('type',tps)}${b}${t=='normal'?`<p class="mu">수수료율 ${cfg.rates[f.pay]}%</p>`:''}<button class="p" style="width:100%;margin-top:12px" onclick="save()">저장</button></div>`}
const pn=x=>x.t=='etc'?esc(x.buyer||'기타'):P(x.pid).name+' '+(x.s=='L'?'대':'소')+'×'+x.qty+(x.t=='service'&&x.buyer?' → '+esc(x.buyer):'');
function list(){return `<div class="tbl"><table><tr><th>날짜</th><th>판매자</th><th>제품</th><th>유형</th><th>금액</th><th>결제</th><th>수수료</th><th></th></tr>${sales.map(x=>`<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(5)}</td><td>${nm(x.uid)}</td><td>${pn(x)}</td><td>${T[x.t]||x.t}${x.sub=='sep'?'·별도':''}${x.ch?'·'+(x.ch=='naver'?'N':'G'):''}${x.img?' 📷':''}${x.ap=='pending'?' ⏳승인대기':x.ap=='no'?' ❌반려':''}</td><td>${won(x.a)}</td><td>${PM[x.pay]||'-'}</td><td>${won(x.c)}</td><td>${adm()?`<button onclick="edit('${x.id}')">수정</button>`:''}</td></tr>`).join('')}</table></div>`}
function edit(id){const x=sales.find(s=>s.id==id);$('#mb').innerHTML=`<h2>판매 수정</h2><label>판매자</label><select id="e_u">${Object.values(users).filter(u=>u.status=='active'||u.id==x.uid).map(u=>`<option value="${u.id}" ${u.id==x.uid?'selected':''}>${nm(u.id)}</option>`).join('')}</select>
<label>날짜</label><input id="e_d" value="${x.d}"><label>유형</label><select id="e_t">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k==x.t?'selected':''}>${v}</option>`).join('')}</select>
<label>용량</label><select id="e_s"><option value="L" ${x.s=='L'?'selected':''}>대</option><option value="S" ${x.s=='S'?'selected':''}>소</option></select>
<label>수량</label><input id="e_q" type="number" value="${x.qty}"><label>금액</label><input id="e_a" type="number" value="${x.a}">
<label>결제방법</label><select id="e_p">${['cash','card','transfer','-'].map(k=>`<option value="${k}" ${k==x.pay?'selected':''}>${PM[k]||'해당없음'}</option>`).join('')}</select>
<label>구매자</label><input id="e_b" value="${x.buyer||''}"><div class="row" style="margin-top:12px"><button class="p" onclick="saveEdit('${id}')">저장</button><button onclick="saveEdit('${id}',1)">${x.void?'취소 해제':'취소 처리'}</button><button onclick="$('#modal').style.display='none'">닫기</button></div>`;$('#modal').style.display='flex'}
async function saveEdit(id,tog){const x=sales.find(s=>s.id==id);if(cfg.closed[x.d.slice(0,7)])return toast('마감된 달입니다. 마감을 풀고 수정하세요');
const n={uid:$('#e_u').value,d:$('#e_d').value,t:$('#e_t').value,s:$('#e_s').value,qty:+$('#e_q').value,a:+$('#e_a').value,pay:$('#e_p').value,buyer:$('#e_b').value};
n.rate=n.t=='normal'?(cfg.rates[n.pay]||0):0;n.c=Math.round(n.a*n.rate/100);n.void=tog?!x.void:!!x.void;
const before={};Object.keys(n).forEach(k=>{if(n[k]!==x[k])before[k]=x[k]});
await db.doc('sales/'+id).update({...n,hist:firebase.firestore.FieldValue.arrayUnion({by:me.name,at:new Date().toISOString(),before:JSON.stringify(before)})}).catch(err);
$('#modal').style.display='none';await loadSales();draw()}
const nl=()=>notices.filter(x=>!x.void);
function noticeBanner(){const l=nl().slice(0,3);return l.length?`<div class="card"><h2>📢 공지</h2>${l.map(x=>`<div style="margin-bottom:8px"><b>${esc(x.title)}</b> <span class="mu">${x.d}</span><div style="white-space:pre-wrap">${esc(x.body)}</div></div>`).join('')}</div>`:''}
async function approve(id,v){await db.doc('sales/'+id).update({ap:v,hist:firebase.firestore.FieldValue.arrayUnion({by:me.name,at:new Date().toISOString(),before:JSON.stringify({ap:'pending'})})}).catch(err);await loadSales();draw()}

const sf=smf(u),since=u.since||(sf[0]&&sf[0].m+'-01'),days=since?Math.floor((new Date(today())-new Date(since))/864e5)+1:0,b=bal(u),ms=monthsOf(u),
hist=sp.filter(x=>!x.void&&x.uid==u.id&&(!sd.m||x.d.startsWith(sd.m))&&(!sd.q||(x.d+' '+x.amount+' '+(x.type=='pay'?'납부':'기존 미납')).includes(sd.q)));
return `<div class="card"><h2>작업자별 쉐어비</h2>${sel}<p class="mu">${esc(u.nick||u.name)}${since?' · 입사 '+since+' ('+days+'일째)':''}</p><div class="kpi"><div class="mu">월 쉐어비<div class="big">${won(curFee(u)||0)}</div></div><div class="mu">총 청구<div class="big">${won(accr(u)+spSum(u.id,'carry'))}</div></div><div class="mu">총 납부<div class="big">${won(spSum(u.id,'pay'))}</div></div><div class="mu">현재 잔액<div class="big">${balTx(b,1)}</div></div></div>
<div class="tbl" style="margin-top:10px"><table><tr><th>월</th><th>청구</th><th>납부</th></tr>${ms.map(m=>`<tr><td>${m}</td><td>${won(feeOf(u,m))}</td><td>${won(paidIn(u,m))}</td></tr>`).join('')||'<tr><td>시작월을 먼저 저장하세요</td></tr>'}</table></div>
<h2 style="margin-top:14px">납부 내역</h2><div class="row"><input type="month" style="width:auto" value="${sd.m}" onchange="sd.m=this.value;draw()"><button onclick="sd.m='';sd.q='';draw()">전체</button><input style="flex:1;min-width:120px" placeholder="검색 (날짜, 금액)" value="${esc(sd.q)}" onchange="sd.q=this.value;draw()"></div><div class="tbl" style="margin-top:8px"><table><tr><th>날짜</th><th>구분</th><th>금액</th></tr>${hist.map(x=>`<tr><td>${x.d}</td><td>${x.type=='pay'?'납부':'기존 미납'}</td><td>${won(x.amount)}</td></tr>`).join('')||'<tr><td>내역이 없어요</td></tr>'}</table></div></div>`}
const share=()=>shareSum()+shareDetail()+shareBase();
function shareLock(){return `<div class="card"><h2>🔒 쉐어</h2><p class="mu">본인만 볼 수 있어요. 로그인 비밀번호를 입력해 주세요.</p><input id="sp_pw" type="password" placeholder="비밀번호"><button class="p" style="width:100%;margin-top:12px" onclick="unlockShare()">확인</button></div>`}
function unlockShare(){const u=auth.currentUser;u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,$('#sp_pw').value)).then(()=>{shareOK=true;draw()}).catch(()=>toast('비밀번호가 맞지 않아요'))}
function shareMe(){if(!shareOK)return shareLock();const sf=smf(me),since=me.since||(sf[0]&&sf[0].m+'-01'),days=since?Math.floor((new Date(today())-new Date(since))/864e5)+1:0,pays=sp.filter(x=>!x.void&&x.type=='pay'),b=bal(me),fee=curFee(me);
return `<div class="card"><h2>${days>0?'블랙고스트와 '+days+'일째 💪':'쉐어비 현황'}</h2><div class="kpi"><div class="mu">월 쉐어비<div class="big">${fee==null?'-':won(fee)}</div></div><div class="mu">총 납부금액<div class="big">${won(spSum(me.id,'pay'))}</div></div><div class="mu">납부 예정<div class="big">${b>0?won(b):b<0?'선납 '+won(-b):'완납'}</div></div></div><p class="mu">매월 15일이 결제일이에요.</p></div><div class="card"><h2>납부 내역</h2><div class="tbl"><table><tr><th>날짜</th><th>금액</th></tr>${pays.map(x=>`<tr><td>${x.d}</td><td>${won(x.amount)}</td></tr>`).join('')||'<tr><td>내역이 없어요</td></tr>'}</table></div></div>`}
// ----- supplies
async function loadSup(){const a=await db.collection('supplies').get();sup=[];a.forEach(d=>sup.push({id:d.id,...d.data()}));sup.sort((x,y)=>(x.cat+x.name)<(y.cat+y.name)?-1:1);
const q=await(adm()?db.collection('supreq'):db.collection('supreq').where('uid','==',me.id)).get();sreq=[];q.forEach(d=>sreq.push({id:d.id,...d.data()}));sreq.sort((x,y)=>(y.at||'')<(x.at||'')?-1:1)}
async function addSup(){const n=$('#p_n').value.trim();if(!n)return toast('품목 이름을 입력하세요');const done=await db.collection('supplies').add({name:n,cat:$('#p_c').value,qty:+$('#p_q').value||0,status:$('#p_s').value,memo:$('#p_m').value.trim(),void:false}).then(()=>1).catch(err);if(!done)return;await loadSup();draw()}
async function updSup(id,k,v){await db.doc('supplies/'+id).update({[k]:k=='qty'?+v:v}).catch(err);await loadSup();draw()}
async function reqSup(){const it=sup.find(x=>x.id==rq.i),n=it?it.name:rq.n.trim();if(!n||!(+rq.q>0))return toast('품목과 수량을 확인하세요');const done=await db.collection('supreq').add({uid:me.id,iid:rq.i,name:n,qty:+rq.q,memo:rq.m.trim(),d:today(),at:new Date().toISOString(),st:'pending'}).then(()=>1).catch(err);if(!done)return;rq={i:'',n:'',q:1,m:''};await loadSup();draw()}
async function supSt(id,v){await db.doc('supreq/'+id).update({st:v}).catch(err);await loadSup();draw()}
function supView(){const ad=adm(),l=sup.filter(x=>!x.void&&(supCat=='전체'||x.cat==supCat)),bad=x=>x=='정상'?'':'wa';
const head=`<div class="card"><h2>비품 · 소모품 현황</h2><div class="row">${['전체',...SC].map(c=>`<button class="${supCat==c?'on':''}" onclick="supCat='${c}';draw()">${c}</button>`).join('')}</div><div class="tbl" style="margin-top:10px"><table><tr><th>분류</th><th>품목</th><th>재고</th><th>상태</th><th>메모</th><th></th></tr>${l.map(x=>ad?`<tr><td>${x.cat}</td><td>${esc(x.name)}</td><td><input type="number" style="width:70px" value="${x.qty}" onchange="updSup('${x.id}','qty',this.value)"></td><td><select style="width:100px" onchange="updSup('${x.id}','status',this.value)">${SS.map(s2=>`<option ${s2==x.status?'selected':''}>${s2}</option>`).join('')}</select></td><td>${esc(x.memo)}</td><td><button onclick="updSup('${x.id}','void',true)">삭제</button></td></tr>`:`<tr><td>${x.cat}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td class="${bad(x.status)}">${x.status}</td><td>${esc(x.memo)}</td><td><button onclick="rq.i='${x.id}';draw()">요청</button></td></tr>`).join('')||'<tr><td>등록된 품목이 없어요</td></tr>'}</table></div></div>`;
if(ad)return head+`<div class="card"><h2>품목 추가</h2><label>분류</label><select id="p_c">${SC.map(c=>`<option>${c}</option>`).join('')}</select><label>품목 이름</label><input id="p_n"><label>재고 수량</label><input id="p_q" type="number" value="0"><label>상태</label><select id="p_s">${SS.map(c=>`<option>${c}</option>`).join('')}</select><label>메모</label><input id="p_m"><button class="p" style="width:100%;margin-top:12px" onclick="addSup()">추가</button></div><div class="card"><h2>요청 목록</h2><div class="tbl"><table><tr><th>날짜</th><th>요청자</th><th>품목</th><th>수량</th><th>메모</th><th>상태</th><th></th></tr>${sreq.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${nm(x.uid)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${esc(x.memo)}</td><td>${RS[x.st]}</td><td>${x.st=='pending'?`<button class="p" onclick="supSt('${x.id}','ok')">승인</button><button onclick="supSt('${x.id}','no')">반려</button>`:x.st=='ok'?`<button class="p" onclick="supSt('${x.id}','done')">완료</button>`:''}</td></tr>`).join('')||'<tr><td>요청이 없어요</td></tr>'}</table></div></div>`;
return head+`<div class="card"><h2>요청하기</h2><label>품목</label><select onchange="rq.i=this.value;draw()"><option value="">직접 입력</option>${sup.filter(x=>!x.void).map(x=>`<option value="${x.id}" ${rq.i==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${rq.i?'':`<label>품목 이름 (목록에 없는 경우)</label><input value="${esc(rq.n)}" oninput="rq.n=this.value">`}<label>수량</label><input type="number" min="1" value="${rq.q}" oninput="rq.q=this.value"><label>메모</label><textarea rows="2" oninput="rq.m=this.value">${esc(rq.m)}</textarea><button class="p" style="width:100%;margin-top:12px" onclick="reqSup()">요청 보내기</button></div><div class="card"><h2>내 요청</h2><div class="tbl"><table><tr><th>날짜</th><th>품목</th><th>수량</th><th>상태</th></tr>${sreq.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${RS[x.st]}</td></tr>`).join('')||'<tr><td>요청 내역이 없어요</td></tr>'}</table></div></div>`}
// ----- notices
async function postNotice(){const t=$('#n_t').value.trim(),b=$('#n_b').value.trim();if(!t)return toast('제목을 입력하세요');const done=await db.collection('notices').add({title:t,body:b,d:today(),at:new Date().toISOString(),void:false}).then(()=>1).catch(err);if(!done)return;await loadNotices();draw()}
async function voidNotice(id,v){await db.doc('notices/'+id).update({void:v}).catch(err);await loadNotices();draw()}
function noticeCard(){return `<div class="card"><h2>공지사항 작성</h2><p class="mu">등록하면 작업자가 앱을 열 때 팝업으로 한 번 보이고, 내현황 위에도 계속 표시돼요.</p><label>제목</label><input id="n_t"><label>내용</label><textarea id="n_b" rows="4"></textarea><button class="p" style="width:100%;margin-top:12px" onclick="postNotice()">공지 등록</button><div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>제목</th><th></th></tr>${notices.slice(0,15).map(x=>`<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(2)}</td><td>${esc(x.title)}</td><td><button onclick="voidNotice('${x.id}',${!x.void})">${x.void?'복구':'삭제'}</button></td></tr>`).join('')}</table></div></div>`}
function showNotice(){let seen=[];try{seen=JSON.parse(localStorage.getItem('seenN')||'[]')}catch(e){}const nw=nl().filter(x=>!seen.includes(x.id));if(!nw.length)return;
$('#mb').innerHTML='<h2>📢 공지사항</h2>'+nw.slice(0,3).map(x=>`<div style="margin-bottom:10px"><b>${esc(x.title)}</b><div style="white-space:pre-wrap">${esc(x.body)}</div></div>`).join('')+'<button class="p" style="width:100%" onclick="ackNotice()">확인</button>';$('#modal').style.display='flex'}
function ackNotice(){try{localStorage.setItem('seenN',JSON.stringify(nl().map(x=>x.id)))}catch(e){}$('#modal').style.display='none'}
function draw(){const ad=adm(),tabs=ad?[['home','총괄'],['in','판매입력'],['toss','토스'],['sup','비품·소모품'],['set','정산'],['share','쉐어비'],['inv','재고·마진'],['conf','설정']]:[['home','내현황'],['in','판매입력'],['share','쉐어'],['toss','토스'],['sup','비품·소모품']];
view((ad?'':`<div class="card"><b>${esc(me.nick||me.name)}님 오늘도 화이팅! 💪</b></div>`)+`<div class="card row"><b>BLACKGHOST TATTOO STUDIO</b><span class="mu">${esc(me.nick||me.name)}${ad?' (총괄)':''} · v11</span><button style="margin-left:auto" onclick="out()">로그아웃</button></div><div class="tabs row" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`+
(tab=='in'?form():tab=='toss'?tossView():tab=='sup'?supView():tab=='set'&&ad?settle():tab=='share'?(ad?share():shareMe()):tab=='conf'&&ad?conf()+noticeCard():tab=='inv'&&ad?inv():home()))}
</script></body></html>
