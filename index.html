<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매관리</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#77756f;--ac:#1f6f5c;--ln:#e4e1da;--wa:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#eeece6;--mu:#9c9a93;--ac:#4fb59b;--ln:#363633;--wa:#e08a50}}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input,select{font:inherit;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th,.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}.wa{color:var(--wa)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:10px;padding:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px}#modal>div{max-height:90vh;overflow:auto;width:100%;max-width:420px}
</style></head><body><main id="app">불러오는 중…</main><div id="modal"><div class="card" id="mb"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBTqRIfhUzlsO2YOfaEBlMHWGlLW-R44Z4",authDomain:"tattoo-cream-ecacc.firebaseapp.com",projectId:"tattoo-cream-ecacc",storageBucket:"tattoo-cream-ecacc.firebasestorage.app",messagingSenderId:"692684499045",appId:"1:692684499045:web:c3a10ae76dd8ff418cfe8c"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);
const T={normal:'정상판매',review:'리뷰이벤트',bundled:'작업비 포함(무료)',service:'서비스',svcreview:'서비스+리뷰'},PM={cash:'현금',card:'카드',transfer:'이체'};
const today=()=>new Date().toLocaleDateString('sv'),won=n=>(n||0).toLocaleString()+'원';
const DEF={rates:{cash:20,card:0,transfer:20},paid:{},closed:{},products:[{id:'p1',name:'허니구',on:1,pr:{normal:{S:5000,L:10000},review:{S:1000,L:5000}},base:{S:0,L:0}}]};
let me,cfg=DEF,users={},sales=[],tab='in',month=today().slice(0,7),setMonth='',f={pid:'p1',size:'L',qty:1,type:'normal',pay:'card',ch:'naver',rid:'',buyer:'',amt:null,img:''};
const adm=()=>me&&me.role=='admin',P=id=>cfg.products.find(p=>p.id==id)||{name:'?',pr:{normal:{},review:{}},base:{}};
const nm=id=>users[id]?users[id].name+(users[id].status=='disabled'?'(비활성)':''):(me&&id==me.id?me.name:'?');
const toast=m=>{alert(m)},err=e=>toast('오류: '+(e.message||e));
const price=(p,t,s,ch)=>t=='normal'?p.pr.normal[s]:t=='review'?p.pr.review[s]:t=='svcreview'&&ch=='naver'?100:0;
const payOf=(t,ch)=>t=='normal'||t=='review'?f.pay:t=='svcreview'&&ch=='naver'?'card':'-';
let allSales=[],buys=[],cnts=[],cashs=[],sp=[];
function view(h){$('#app').innerHTML=h}
function login(){view(`<div class="card"><h2>🌿 판매관리 로그인</h2><label>이메일</label><input id="em" type="email"><label>비밀번호 (6자 이상)</label><input id="pw" type="password">
<div class="row" style="margin-top:12px"><button class="p" onclick="doLogin()">로그인</button><button onclick="doSignup()">가입하기</button><button onclick="doReset()">비밀번호 재설정</button></div></div>`)}
const doLogin=()=>auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(err);
const doSignup=()=>auth.createUserWithEmailAndPassword($('#em').value,$('#pw').value).then(c=>c.user.sendEmailVerification()).catch(err);
const doReset=()=>auth.sendPasswordResetEmail($('#em').value).then(()=>toast('재설정 메일을 보냈어요')).catch(err);
const out=()=>auth.signOut();
const gate=(t,body)=>view(`<div class="card"><h2>${t}</h2>${body}<div class="row" style="margin-top:12px"><button onclick="location.reload()">새로고침</button><button onclick="out()">로그아웃</button></div></div>`);
auth.onAuthStateChanged(async u=>{if(!u)return login();try{await boot(u)}catch(e){gate('오류가 났어요','<p>'+(e.message||e)+'</p><p class="mu">보안 규칙이 게시됐는지 확인하세요.</p>')}});
async function boot(u){await u.reload();await u.getIdToken(true);
if(!u.emailVerified)return gate('이메일 인증이 필요해요','<p>'+u.email+'로 보낸 인증 메일의 링크를 누른 뒤 새로고침하세요. 메일이 안 오면 스팸함을 확인하세요.</p>');
const s=await db.doc('users/'+u.uid).get();
if(!s.exists)return gate('가입 정보 입력',`<label>이름</label><input id="nn"><label>가게 가입코드</label><input id="cd"><button class="p" style="margin-top:12px" onclick="mkProfile('${u.uid}','${u.email}')">신청</button>`);
me={id:u.uid,...s.data()};if(me.status=='disabled')return gate('비활성 계정','<p>대장님께 문의하세요.</p>');
if(me.status!='active')return gate('승인 대기 중','<p>대장님이 승인하면 사용할 수 있어요.</p>');
const c=await db.doc('config/main').get();if(c.exists)cfg=c.data();
if(adm()){const us=await db.collection('users').get();us.forEach(d=>users[d.id]={id:d.id,...d.data()});await loadBuys()}
await loadSales();tab=adm()?'home':'in';draw()}
function mkProfile(id,email){db.doc('users/'+id).set({name:$('#nn').value.trim(),email,role:'artist',status:'pending',code:$('#cd').value.trim()}).then(()=>location.reload()).catch(()=>toast('가입코드가 맞지 않아요'))}
async function loadSales(){const s=await(adm()?db.collection('sales'):db.collection('sales').where('uid','==',me.id)).get();const a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));allSales=a;sales=a.filter(x=>x.d.startsWith(month));sales.sort((x,y)=>y.d<x.d?-1:1)}
async function loadBuys(){const s=await db.collection('purchases').get();buys=[];s.forEach(d=>buys.push({id:d.id,...d.data()}));buys.sort((a,b)=>b.d<a.d?-1:1);const A=async(n,t)=>{const q=await db.collection(n).get(),r=[];q.forEach(d=>r.push({id:d.id,...d.data()}));return r.sort((a,b)=>b.d<a.d?-1:1)};cnts=await A('counts');cashs=await A('cash');sp=await A('sharepay')}
const live=()=>sales.filter(x=>!x.void);
async function save(){const p=P(f.pid),t=f.type,pay=payOf(t,f.ch),d=(adm()&&f.d)||today(),u=(adm()&&f.uid)||me.id;if(cfg.closed[d.slice(0,7)])return toast('마감된 달입니다');if(t=='svcreview'&&!f.rid.trim()&&!f.img)return toast('리뷰 작성자 아이디 또는 리뷰 캡처 중 하나는 꼭 입력하세요');if(t=='service'&&!adm())return toast('서비스는 대장님만 입력할 수 있어요');
const auto=price(p,t,f.size,f.ch)*f.qty,a=t=='svcreview'||f.amt==null?auto:+f.amt,rate=t=='normal'?cfg.rates[pay]:0;
const ok=await db.collection('sales').add({d,uid:u,pid:f.pid,s:f.size,qty:f.qty,t,ch:t=='svcreview'||t=='review'?f.ch:'',pay,buyer:f.buyer,a,lp:p.pr.normal[f.size]*f.qty,rate,c:Math.round(a*rate/100),img:f.img,rid:f.rid.trim(),void:false,hist:[]}).then(()=>1).catch(err);if(!ok)return;
Object.assign(f,{amt:null,buyer:'',rid:'',img:'',d:'',uid:''});month=d.slice(0,7);tab='home';await loadSales();draw()}
function pic(i){const fl=i.files[0];if(!fl)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,800/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f.img=c.toDataURL('image/jpeg',.6);draw()};im.src=URL.createObjectURL(fl)}
function setF(k,v){f[k]=v;if(['type','size','pid','ch','qty'].includes(k))f.amt=null;draw()}
const seg=(k,o)=>'<div class="row">'+o.map(([v,l])=>`<button class="${f[k]==v?'on':''}" onclick="setF('${k}','${v}')">${l}</button>`).join('')+'</div>';
function form(){const p=P(f.pid),t=f.type,auto=price(p,t,f.size,f.ch)*f.qty,g=t=='svcreview'||(t=='review'&&f.ch=='google'),rq=t=='svcreview';
return `<div class="card"><h2>판매 입력</h2>${adm()?`<label>판매자 (대신 입력)</label><select onchange="f.uid=this.value">${Object.values(users).filter(u=>u.status=='active').map(u=>`<option value="${u.id}" ${(f.uid||me.id)==u.id?'selected':''}>${nm(u.id)}</option>`).join('')}</select><label>판매 날짜</label><input type="date" value="${f.d||today()}" onchange="f.d=this.value">`:''}<label>제품</label><select onchange="setF('pid',this.value)">${cfg.products.filter(x=>x.on).map(x=>`<option value="${x.id}" ${x.id==f.pid?'selected':''}>${x.name}</option>`).join('')}</select>
<label>용량</label>${seg('size',[['L','대'],['S','소']])}<label>유형</label>${seg('type',Object.entries(T).filter(([k])=>k!='service'||adm()))}
${t=='svcreview'||t=='review'?'<label>리뷰 채널</label>'+seg('ch',[['naver','네이버'],['google','구글']]):''}
${t=='normal'||t=='review'?'<label>결제방법</label>'+seg('pay',Object.entries(PM)):''}
${g?`<label>리뷰 작성자 아이디${rq?' (아이디 또는 캡처 중 하나는 필수)':' (선택)'}</label><input value="${f.rid}" oninput="f.rid=this.value"><label>리뷰 캡처${rq?' (아이디 또는 캡처 중 하나는 필수)':' (선택)'}</label><input type="file" accept="image/*" onchange="pic(this)">${f.img?'<div class="mu">✔ 캡처 첨부됨</div>':''}`:''}
<label>수량 / 금액 (예외 시 직접 수정)</label><div class="row"><input type="number" min="1" style="width:30%" value="${f.qty}" onchange="setF('qty',Math.max(1,+this.value))"><input type="number" style="flex:1" ${rq?'disabled':''} value="${f.amt==null||rq?auto:f.amt}" oninput="f.amt=this.value"></div>
<label>구매자 이름 (선택)</label><input value="${f.buyer}" oninput="f.buyer=this.value"><p class="mu">결제: ${PM[payOf(t,f.ch)]||'해당없음'} · 수수료율 ${t=='normal'?cfg.rates[f.pay]:0}%</p>${rq&&f.ch=='naver'?'<p class="mu">네이버 리뷰는 영수증 인증을 위해 100원 카드결제로 자동 처리돼요.</p>':''}
<button class="p" style="width:100%" onclick="save()">저장</button></div>`}
function list(){return `<div class="tbl"><table><tr><th>날짜</th><th>판매자</th><th>제품</th><th>유형</th><th>금액</th><th>결제</th><th>수수료</th><th></th></tr>${sales.map(x=>`<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(5)}</td><td>${nm(x.uid)}</td><td>${P(x.pid).name} ${x.s=='L'?'대':'소'}×${x.qty}</td><td>${T[x.t]}${x.ch?'·'+(x.ch=='naver'?'N':'G'):''}${x.img?' 📷':''}</td><td>${won(x.a)}</td><td>${PM[x.pay]||'-'}</td><td>${won(x.c)}</td><td>${adm()?`<button onclick="edit('${x.id}')">수정</button>`:''}</td></tr>`).join('')}</table></div>`}
function edit(id){const x=sales.find(s=>s.id==id);$('#mb').innerHTML=`<h2>판매 수정</h2><label>판매자</label><select id="e_u">${Object.values(users).filter(u=>u.status=='active'||u.id==x.uid).map(u=>`<option value="${u.id}" ${u.id==x.uid?'selected':''}>${nm(u.id)}</option>`).join('')}</select>
<label>날짜</label><input id="e_d" value="${x.d}"><label>유형</label><select id="e_t">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k==x.t?'selected':''}>${v}</option>`).join('')}</select>
<label>용량</label><select id="e_s"><option value="L" ${x.s=='L'?'selected':''}>대</option><option value="S" ${x.s=='S'?'selected':''}>소</option></select>
<label>수량</label><input id="e_q" type="number" value="${x.qty}"><label>금액</label><input id="e_a" type="number" value="${x.a}">
<label>결제방법</label><select id="e_p">${['cash','card','transfer','-'].map(k=>`<option value="${k}" ${k==x.pay?'selected':''}>${PM[k]||'해당없음'}</option>`).join('')}</select>
<label>구매자</label><input id="e_b" value="${x.buyer||''}"><div class="row" style="margin-top:12px"><button class="p" onclick="saveEdit('${id}')">저장</button><button onclick="saveEdit('${id}',1)">${x.void?'취소 해제':'취소 처리'}</button><button onclick="$('#modal').style.display='none'">닫기</button></div>`;$('#modal').style.display='flex'}
async function saveEdit(id,tog){const x=sales.find(s=>s.id==id);if(cfg.closed[x.d.slice(0,7)])return toast('마감된 달입니다. 마감을 풀고 수정하세요');
const n={uid:$('#e_u').value,d:$('#e_d').value,t:$('#e_t').value,s:$('#e_s').value,qty:+$('#e_q').value,a:+$('#e_a').value,pay:$('#e_p').value,buyer:$('#e_b').value};
n.rate=n.t=='normal'?(cfg.rates[n.pay]||0):0;n.c=Math.round(n.a*n.rate/100);n.void=tog?!x.void:!!x.void;
const before={};Object.keys(n).forEach(k=>{if(n[k]!==x[k])before[k]=x[k]});
await db.doc('sales/'+id).update({...n,hist:firebase.firestore.FieldValue.arrayUnion({by:me.name,at:new Date().toISOString(),before:JSON.stringify(before)})}).catch(err);
$('#modal').style.display='none';await loadSales();draw()}
function home(){const l=live(),sum=k=>l.reduce((a,x)=>a+x[k],0),g=sales.filter(x=>x.ch=='google'&&!x.img&&!x.rid&&!x.void).length;
return `<div class="card"><div class="row"><h2 style="margin:0">${adm()?'전체':'내'} 현황</h2><input type="month" style="width:auto" value="${month}" onchange="month=this.value;loadSales().then(draw)"></div>
<div class="kpi" style="margin-top:10px"><div class="mu">매출<div class="big">${won(sum('a'))}</div></div><div class="mu">${adm()?'지급할':'예상'} 수수료<div class="big">${won(sum('c'))}</div></div><div class="mu">무료 제공<div class="big">${l.filter(x=>x.a==0).length}건</div></div></div>${adm()?`<p class="mu">증빙 없는 구글 리뷰 건: ${g}건</p>`:''}</div><div class="card"><h2>내역</h2>${list()}</div>`}
function settle(){const m=setMonth||month,cl=cfg.closed[m];const l=live(),ids=[...new Set(l.map(x=>x.uid))];
return `<div class="card"><h2>월 정산</h2><div class="row"><input type="month" style="width:auto" value="${m}" onchange="setMonth=this.value;month=this.value;loadSales().then(draw)"><button class="${cl?'p':''}" onclick="closeMonth('${m}',${!cl})">${cl?'🔒 마감됨 (풀기)':'월 마감하기'}</button></div>
<div class="tbl"><table><tr><th>작업자</th><th>건수</th><th>현금·이체</th><th>카드</th><th>수수료</th><th>상태</th></tr>${ids.map(u=>{const a=l.filter(x=>x.uid==u),by=(...k)=>a.filter(x=>k.includes(x.pay)).reduce((s,x)=>s+x.a,0),k=m+u;
return `<tr><td>${nm(u)}</td><td>${a.length}</td><td>${won(by('cash','transfer'))}</td><td>${won(by('card'))}</td><td><b>${won(a.reduce((s,x)=>s+x.c,0))}</b></td><td><button class="${cfg.paid[k]?'p':''}" onclick="setCfg('paid.${k}',${!cfg.paid[k]})">${cfg.paid[k]?'지급완료':'미지급'}</button></td></tr>`}).join('')}</table></div></div>`}
async function setCfg(path,v){const ks=path.split('.');let o=cfg;ks.slice(0,-1).forEach(k=>o=o[k]=o[k]||{});o[ks.at(-1)]=v;await db.doc('config/main').set(cfg).catch(err);draw()}
async function setUser(id,st){await db.doc('users/'+id).update({status:st}).catch(err);users[id].status=st;draw()}
function conf(){const us=Object.values(users).filter(u=>u.role!='admin');
return `<div class="card"><h2>작업자 관리</h2>${us.map(u=>`<div class="row" style="margin-bottom:6px"><b>${u.name}</b><span class="mu">${u.email}</span><span class="${u.status=='pending'?'wa':'mu'}">${{pending:'승인 대기',active:'활성',disabled:'비활성'}[u.status]}</span>
<button class="${u.status=='active'?'':'p'}" onclick="setUser('${u.id}','${u.status=='active'?'disabled':'active'}')">${u.status=='active'?'비활성화':u.status=='pending'?'승인':'재활성화'}</button></div>`).join('')||'<p class="mu">없음</p>'}
<label>가게 가입코드 (작업자에게 알려주는 코드)</label><div class="row"><input id="sc" style="flex:1"><button onclick="db.doc('settings/app').set({signupCode:$('#sc').value.trim()}).then(()=>toast('변경됨')).catch(err)">저장</button></div></div>
<div class="card"><h2>수수료율 (%)</h2><div class="row">${Object.entries(PM).map(([k,l])=>`<div style="flex:1">${l}<input type="number" value="${cfg.rates[k]}" onchange="setCfg('rates.${k}',+this.value)"></div>`).join('')}</div><p class="mu">이후 입력부터 적용돼요. 저장된 건은 입력 당시 비율을 유지해요.</p></div>
<div class="card"><h2>제품 · 가격</h2>${cfg.products.map((p,i)=>`<div style="margin-bottom:12px"><div class="row"><b>${p.name}</b><button class="${p.on?'p':''}" onclick="setCfg('products.${i}.on',${p.on?0:1})">${p.on?'판매중':'판매중지'}</button></div>
<div class="row mu">${[['normal','S','정상 소'],['normal','L','정상 대'],['review','S','리뷰 소'],['review','L','리뷰 대']].map(([a,b,l])=>`<span style="flex:1">${l}<input type="number" value="${p.pr[a][b]}" onchange="setCfg('products.${i}.pr.${a}.${b}',+this.value)"></span>`).join('')}</div></div>`).join('')}
<div class="row"><input id="np" placeholder="새 제품명" style="flex:1"><button onclick="const n=$('#np').value.trim();if(n)setCfg('products.'+cfg.products.length,{id:'p'+(cfg.products.length+1),name:n,on:1,pr:{normal:{S:5000,L:10000},review:{S:1000,L:5000}},base:{S:0,L:0}})">추가</button></div></div>`}
const bl=()=>buys.filter(b=>!b.void);
function calc(){const ev=[];bl().forEach(b=>ev.push({k:b.pid+b.s,d:b.d,o:0,b}));allSales.filter(x=>!x.void).forEach(x=>ev.push({k:x.pid+x.s,d:x.d,o:1,x}));cnts.filter(x=>!x.void).forEach(x=>ev.push({k:x.pid+x.s,d:x.d,o:2,n:x}));
ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.o-b.o);const st={},cost={},noc={},cnt={};
ev.forEach(e=>{const t=st[e.k]=st[e.k]||{q:0,a:0};if(e.b){t.a=t.q>0?(t.q*t.a+e.b.total)/(t.q+e.b.qty):e.b.total/e.b.qty;t.q+=e.b.qty}else if(e.n){const bk=t.q;cnt[e.n.id]={book:bk,diff:bk-e.n.qty,loss:(bk-e.n.qty)*t.a};t.q=e.n.qty}else{cost[e.x.id]=e.x.qty*t.a;if(!t.a)noc[e.x.id]=1;t.q-=e.x.qty}});return{st,cost,noc,cnt}}
function mar(m){const c=calc(),l=allSales.filter(x=>!x.void&&x.d.startsWith(m)),sm=k=>l.reduce((a,x)=>a+x[k],0);
return{loss:Math.round(cnts.filter(x=>!x.void&&x.d.startsWith(m)).reduce((a,x)=>a+((c.cnt[x.id]||{}).loss||0),0)),rev:sm('a'),com:sm('c'),cs:Math.round(l.reduce((a,x)=>a+(c.cost[x.id]||0),0)),noc:l.filter(x=>c.noc[x.id]).reduce((a,x)=>a+x.qty,0),buy:bl().filter(b=>b.d.startsWith(m)).reduce((a,b)=>a+b.total,0)}}
async function closeMonth(m,v){cfg.closed=cfg.closed||{};cfg.snap=cfg.snap||{};if(v)cfg.snap[m]=mar(m);else delete cfg.snap[m];cfg.closed[m]=v;await db.doc('config/main').set(cfg).catch(err);draw()}
async function addBuy(){const q=+$('#b_q').value,t=+$('#b_t').value;if(!(q>0)||!(t>=0)||!$('#b_d').value)return toast('날짜, 수량, 금액을 확인하세요');
await db.collection('purchases').add({d:$('#b_d').value,vendor:$('#b_v').value.trim(),pid:$('#b_p').value,s:$('#b_s').value,qty:q,total:t,memo:$('#b_m').value,void:false}).catch(err);await loadBuys();draw()}
async function voidBuy(id,v){await db.doc('purchases/'+id).update({void:v}).catch(err);await loadBuys();draw()}
function inv(){const c=calc(),sn=cfg.closed[month]&&(cfg.snap||{})[month],r=sn||mar(month),mg=r.rev-r.cs-r.com-(r.loss||0);
const rows=cfg.products.flatMap(p=>['L','S'].map(x=>({p,s:x,...(c.st[p.id+x]||{q:0,a:0})}))).filter(r=>r.q||r.a);
return `<div class="card"><div class="row"><h2 style="margin:0">월 마진</h2><input type="month" style="width:auto" value="${month}" onchange="month=this.value;loadSales().then(draw)"></div>
<div class="tbl" style="margin-top:8px"><table><tr><td>매출</td><td>${won(r.rev)}</td></tr><tr><td>− 원가 (판매·무료 제공 × 당시 평균 원가)</td><td>${won(r.cs)}</td></tr><tr><td>− 작업자 수수료</td><td>${won(r.com)}</td></tr><tr><td>− 재고 실사 차이 손실</td><td>${won(r.loss||0)}</td></tr><tr><td><b>내 마진</b></td><td><b class="big">${won(mg)}</b></td></tr><tr><td class="mu">이달 입고에 쓴 돈</td><td class="mu">${won(r.buy)}</td></tr></table></div>${sn?'<p class="mu">🔒 마감 시점 값으로 고정되어 있어요.</p>':''}${r.noc?`<p class="wa">구매가가 없는 판매 ${r.noc}개가 있어요. 입고 기록을 확인하세요. (원가 0원으로 계산됨)</p>`:''}</div>
<div class="card"><h2>현재 재고</h2><div class="tbl"><table><tr><th>제품</th><th>수량</th><th>평균 원가</th><th>재고 금액</th></tr>${rows.map(r=>`<tr><td>${r.p.name} ${r.s=='L'?'대':'소'}</td><td class="${r.q<0?'wa':''}">${r.q}개</td><td>${won(Math.round(r.a))}</td><td>${won(Math.round(r.q*r.a))}</td></tr>`).join('')||'<tr><td>입고 기록이 없어요</td></tr>'}</table></div></div>
<div class="card"><h2>입고 기록</h2><div class="row"><div style="flex:1"><label>날짜</label><input id="b_d" type="date" value="${today()}"></div><div style="flex:1"><label>납품처</label><input id="b_v"></div></div>
<div class="row"><div style="flex:1"><label>제품</label><select id="b_p">${cfg.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div style="flex:1"><label>용량</label><select id="b_s"><option value="L">대</option><option value="S">소</option></select></div></div>
<div class="row"><div style="flex:1"><label>수량</label><input id="b_q" type="number"></div><div style="flex:1"><label>총 구매금액(원)</label><input id="b_t" type="number"></div></div><label>메모</label><input id="b_m">
<button class="p" style="width:100%;margin-top:12px" onclick="addBuy()">입고 저장</button>
<div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>납품처</th><th>제품</th><th>수량</th><th>총액</th><th>개당</th><th></th></tr>${buys.slice(0,30).map(b=>`<tr style="${b.void?'opacity:.4;text-decoration:line-through':''}"><td>${b.d.slice(2)}</td><td>${b.vendor||''}</td><td>${P(b.pid).name} ${b.s=='L'?'대':'소'}</td><td>${b.qty}</td><td>${won(b.total)}</td><td>${won(Math.round(b.total/b.qty))}</td><td><button onclick="voidBuy('${b.id}',${!b.void})">${b.void?'복구':'취소'}</button></td></tr>`).join('')}</table></div></div>`+cntCard()+cashCard()}
async function addCnt(){const q=$('#c_q').value;if(q===''||+q<0||!$('#c_d').value)return toast('날짜와 실제 수량을 확인하세요');
const ok=await db.collection('counts').add({d:$('#c_d').value,pid:$('#c_p').value,s:$('#c_s').value,qty:+q,void:false}).then(()=>1).catch(err);if(!ok)return;await loadBuys();draw()}
async function voidCnt(id,v){await db.doc('counts/'+id).update({void:v}).catch(err);await loadBuys();draw()}
function cntCard(){const c=calc();return `<div class="card"><h2>재고 실사</h2><p class="mu">실제로 센 수량을 넣으면 장부와의 차이가 기록돼요. 부족분은 이후 재고에 반영되고, 마진에서 손실로 빠져요.</p>
<div class="row"><div style="flex:1"><label>날짜</label><input id="c_d" type="date" value="${today()}"></div><div style="flex:1"><label>제품</label><select id="c_p">${cfg.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div></div>
<div class="row"><div style="flex:1"><label>용량</label><select id="c_s"><option value="L">대</option><option value="S">소</option></select></div><div style="flex:1"><label>실제 수량</label><input id="c_q" type="number" min="0"></div></div>
<button class="p" style="width:100%;margin-top:12px" onclick="addCnt()">실사 저장</button>
<div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>제품</th><th>장부</th><th>실제</th><th>차이</th><th></th></tr>${cnts.slice(0,20).map(x=>{const k=c.cnt[x.id];return `<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(2)}</td><td>${P(x.pid).name} ${x.s=='L'?'대':'소'}</td><td>${k?k.book:'-'}</td><td>${x.qty}</td><td class="${k&&k.diff?'wa':''}">${k?(k.diff>0?'부족 '+k.diff:k.diff<0?'초과 '+(-k.diff):'일치'):'-'}</td><td><button onclick="voidCnt('${x.id}',${!x.void})">${x.void?'복구':'취소'}</button></td></tr>`}).join('')}</table></div></div>`}
const cashNet=u=>allSales.filter(x=>!x.void&&x.pay=='cash'&&(!u||x.d<=u)).reduce((a,x)=>a+x.a,0)+cashs.filter(x=>!x.void&&x.type!='count'&&(!u||x.d<=u)).reduce((a,x)=>a+(x.type=='in'?x.amount:-x.amount),0);
async function addCash(t){const v=$('#k_a').value;if(v===''||+v<0||!$('#k_d').value)return toast('날짜와 금액을 확인하세요');
const ok=await db.collection('cash').add({d:$('#k_d').value,type:t,amount:+v,memo:$('#k_m').value,void:false}).then(()=>1).catch(err);if(!ok)return;await loadBuys();draw()}
async function voidCash(id,v){await db.doc('cash/'+id).update({void:v}).catch(err);await loadBuys();draw()}
function cashCard(){const sale=allSales.filter(x=>!x.void&&x.pay=='cash').reduce((a,x)=>a+x.a,0),f2=t=>cashs.filter(x=>!x.void&&x.type==t).reduce((a,x)=>a+x.amount,0);
return `<div class="card"><h2>시제 (금고 현금)</h2><div class="big">${won(cashNet())}</div><p class="mu">현금 판매 ${won(sale)} + 입금 ${won(f2('in'))} − 출금 ${won(f2('out'))} · 이체와 카드는 포함되지 않아요.</p>
<div class="row"><div style="flex:1"><label>날짜</label><input id="k_d" type="date" value="${today()}"></div><div style="flex:1"><label>금액(원)</label><input id="k_a" type="number" min="0"></div></div><label>메모</label><input id="k_m" placeholder="예: 기초 시제, 4월 수수료 지급">
<div class="row" style="margin-top:12px"><button onclick="addCash('in')">입금 기록</button><button onclick="addCash('out')">출금 기록</button><button class="p" onclick="addCash('count')">실제 금고 금액 (실사)</button></div>
<div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>구분</th><th>금액</th><th>메모</th><th>장부 대비</th><th></th></tr>${cashs.slice(0,20).map(x=>{const df=x.type=='count'?x.amount-cashNet(x.d):0;return `<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(2)}</td><td>${{in:'입금',out:'출금',count:'실사'}[x.type]}</td><td>${won(x.amount)}</td><td>${x.memo||''}</td><td class="${df?'wa':''}">${x.type=='count'?(df?(df<0?'부족 ':'초과 ')+won(Math.abs(df)):'일치'):''}</td><td><button onclick="voidCash('${x.id}',${!x.void})">${x.void?'복구':'취소'}</button></td></tr>`}).join('')}</table></div></div>`}
function accr(u){const sf=(u.sf||[]).slice().sort((a,b)=>a.m<b.m?-1:1);if(!sf.length)return 0;const t=today();let tot=0,[y,mo]=sf[0].m.split('-').map(Number);
for(let i=0;i<240;i++){const m=y+'-'+String(mo).padStart(2,'0');if(t<m+'-15')break;tot+=sf.filter(x=>x.m<=m).pop().a;if(++mo>12){mo=1;y++}}return tot}
const spSum=(id,t)=>sp.filter(x=>!x.void&&x.uid==id&&x.type==t).reduce((a,x)=>a+x.amount,0);
const bal=u=>accr(u)+spSum(u.id,'carry')-spSum(u.id,'pay');
const curFee=u=>{const sf=(u.sf||[]).slice().sort((a,b)=>a.m<b.m?-1:1),m=today().slice(0,7);return(sf.filter(x=>x.m<=m).pop()||sf[0]||{}).a};
function addAmt(n){$('#s_a').value=(+$('#s_a').value||0)+n}
async function saveFee(id){const a=+$('#f_'+id).value,m=$('#m_'+id).value;if($('#f_'+id).value===''||a<0||!m)return toast('금액과 시작월을 확인하세요');
const u=users[id],sf=(u.sf||[]).filter(x=>x.m!=m);sf.push({m,a});sf.sort((x,y)=>x.m<y.m?-1:1);await db.doc('users/'+id).update({sf}).catch(err);u.sf=sf;draw()}
async function addSP(t){const u=$('#s_u').value,v=+$('#s_a').value,d=$('#s_d').value;if(!u||!(v>0)||!d)return toast('작업자, 날짜, 금액을 확인하세요');
const ok=await db.collection('sharepay').add({uid:u,d,amount:v,type:t,void:false}).then(()=>1).catch(err);if(!ok)return;await loadBuys();draw()}
async function voidSP(id,v){await db.doc('sharepay/'+id).update({void:v}).catch(err);await loadBuys();draw()}
function share(){const us=Object.values(users).filter(u=>u.role!='admin');
return `<div class="card"><h2>셰어비 현황</h2><p class="mu">매월 15일에 월 셰어비가 미납 잔액에 쌓이고, 납부하면 잔액에서 빠져요.</p><div class="tbl"><table><tr><th>작업자</th><th>월 셰어비</th><th>시작월</th><th></th><th>현재 잔액</th></tr>
${us.map(u=>{const b=bal(u),sf=(u.sf||[]).slice().sort((x,y)=>x.m<y.m?-1:1);return `<tr><td>${nm(u.id)}</td><td><input id="f_${u.id}" type="number" style="width:100px" value="${curFee(u)??300000}"></td><td><input id="m_${u.id}" type="month" style="width:130px" value="${(sf.length?sf[sf.length-1].m:today().slice(0,7))}"></td><td><button onclick="saveFee('${u.id}')">저장</button></td>
<td>${!sf.length&&!spSum(u.id,'carry')?'<span class="mu">미설정</span>':b>0?`<b class="wa">${won(b)} 밀림</b>`:b<0?`선납 ${won(-b)}`:'정상'}</td></tr>`}).join('')}</table></div>
<p class="mu">금액을 바꾸려면 새 금액과 적용 시작월을 넣고 저장하세요. 이전 달의 금액은 그대로 유지돼요.</p></div>
<div class="card"><h2>납부 입력</h2><label>작업자</label><select id="s_u">${us.map(u=>`<option value="${u.id}">${nm(u.id)}</option>`).join('')}</select>
<label>날짜</label><input id="s_d" type="date" value="${today()}"><label>납부 금액(원)</label><div class="row"><input id="s_a" type="number" min="0" style="flex:1;min-width:120px"><button onclick="addAmt(100000)">+10만</button><button onclick="addAmt(10000)">+1만</button><button onclick="$('#s_a').value=''">지우기</button></div>
<div class="row" style="margin-top:12px"><button class="p" style="flex:1" onclick="addSP('pay')">납부 저장</button><button onclick="addSP('carry')">기존 미납 추가</button></div>
<p class="mu">기존에 밀려 있던 금액은 '기존 미납 추가'로 한 번 넣어주세요.</p>
<div class="tbl" style="margin-top:12px"><table><tr><th>날짜</th><th>작업자</th><th>구분</th><th>금액</th><th></th></tr>${sp.slice(0,30).map(x=>`<tr style="${x.void?'opacity:.4;text-decoration:line-through':''}"><td>${x.d.slice(2)}</td><td>${nm(x.uid)}</td><td>${x.type=='pay'?'납부':'기존 미납'}</td><td>${won(x.amount)}</td><td><button onclick="voidSP('${x.id}',${!x.void})">${x.void?'복구':'취소'}</button></td></tr>`).join('')}</table></div></div>`}
function draw(){const ad=adm(),tabs=ad?[['home','총괄'],['in','판매입력'],['set','정산'],['share','셰어비'],['inv','재고·마진'],['conf','설정']]:[['home','내 현황'],['in','판매입력']];
view(`<div class="card row"><b>🌿 판매관리</b><span class="mu">${me.name}${ad?' (총괄)':''} · v9</span><button style="margin-left:auto" onclick="out()">로그아웃</button></div><div class="row" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('')}</div>`+
(tab=='in'?form():tab=='set'&&ad?settle():tab=='conf'&&ad?conf():tab=='share'&&ad?share():tab=='inv'&&ad?inv():home()))}
</script></body></html>
