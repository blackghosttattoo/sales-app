<title>유령 마을 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 폰 화면 하나 = 살아 움직이는 유령 마을. 카메라(.cam) 안에 배경 SVG·집·유령·입자 캔버스. 집을 누르면 문이 열리고 카메라가 집으로 다가간 뒤 화면 전환. */
:root{
  --page:#0b0a12; --card:#16141f; --ln:#33304a; --silver:#ece9f3; --mu:#a7a2b8;
  --ac:#58c2a6; --warm:#ffcf6b; --pink:#ff7aa8;
  --f-disp:"Black Han Sans","Apple SD Gothic Neo",sans-serif; --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--silver);font-family:var(--f-body);display:flex;justify-content:center;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.phone{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--mu);text-align:center;line-height:1.5;margin:0}
.note b{color:var(--warm)}
.screen{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--ln);background:#000;height:680px;max-height:calc(100vh - 110px);min-height:540px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#000c,#0000);position:absolute;left:0;right:0;top:0;z-index:8}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:0;letter-spacing:.5px;color:#fff;text-shadow:0 2px 6px #000}
.top .who{font-size:12px;color:#ddd8ea}
.top .sp{flex:1}
.ib{border:1px solid #fff5;background:#0008;color:#fff;border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s}
.ib.on{background:var(--warm);color:#3a2a00;border-color:var(--warm)}
.ib:focus-visible,.house:focus-visible,.nav button:focus-visible,.back:focus-visible,.gb:focus-visible{outline:2px solid var(--warm);outline-offset:2px}

.village{position:relative;flex:1;overflow:hidden;cursor:pointer}
.cam{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.65,0,.35,1),filter .7s}
.cam.zoom{filter:brightness(.4) blur(1px)}
.scene{position:absolute;inset:0;width:100%;height:100%}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.sky{transition:opacity 1.2s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.lampg{animation:lampg 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lampg{50%{opacity:.6;transform:scale(.9)}}
.cloud{animation:cloud 40s linear infinite}
@keyframes cloud{from{transform:translateX(-160px)}to{transform:translateX(460px)}}

.house{position:absolute;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:center;z-index:2;animation:hb 6s ease-in-out infinite}
@keyframes hb{50%{transform:translateY(-2px)}}
.house.hit{animation:squash .45s ease}
@keyframes squash{0%{transform:scale(1)}30%{transform:scale(1.08,.9)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.house svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 8px #000a);overflow:visible}
.house .door{transform-box:fill-box;transform-origin:0% 50%;transition:transform .45s ease}
.house.open .door{transform:perspective(60px) rotateY(-75deg) scaleX(.35)}
.house .lb{display:inline-block;margin-top:-4px;font-size:11.5px;background:#0b0a12d9;color:#fff;border:1px solid #ffffff22;border-radius:8px;padding:2px 7px;white-space:nowrap}
.bub{position:absolute;top:-8px;right:-6px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;box-shadow:0 2px 8px #000a;animation:bob 1.8s ease-in-out infinite;white-space:nowrap;z-index:1}
.bub.y{background:var(--warm);color:#3a2a00}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}
.win{animation:flick 5s infinite}
:root.day .win{animation:none;opacity:.35}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.7}50%{opacity:1}52%{opacity:.8}}
.neon{animation:neon 1.6s steps(2) infinite}
@keyframes neon{50%{opacity:.5}}
.smoke{animation:smk 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.7}100%{opacity:0;transform:translate(10px,-34px) scale(1.8)}}

/* 내 유령: JS가 위치를 옮김 */
.me{position:absolute;width:86px;height:93px;margin:-80px 0 0 -43px;z-index:4;transition:left 1.1s cubic-bezier(.45,0,.25,1),top 1.1s cubic-bezier(.45,0,.25,1);pointer-events:none}
.me .body{width:100%;height:100%;animation:fl 2.6s ease-in-out infinite;transform-origin:50% 90%}
.me .tilt{width:100%;height:100%;transition:transform .5s}
.me.spin .body{animation:spin .9s ease}
.me.jump .body{animation:jmp .7s ease}
@keyframes fl{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-10px) scale(.97,1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jmp{0%{transform:scale(1.15,.85)}35%{transform:translateY(-34px) scale(.9,1.1)}70%{transform:translateY(0) scale(1.1,.9)}100%{transform:scale(1)}}
.me .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(1);background:#fff;color:#222;font-size:12px;border-radius:10px;padding:4px 9px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px #0008;transition:transform .25s,opacity .25s}
.me .say.hide{transform:translateX(-50%) scale(.6);opacity:0}
.me .say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.shadow{position:absolute;left:50%;bottom:-12px;width:50px;height:9px;margin-left:-25px;border-radius:50%;background:#0008;animation:shd 2.6s ease-in-out infinite;filter:blur(1px)}
@keyframes shd{50%{transform:scale(.75);opacity:.55}}
.mini{position:absolute;width:32px;height:35px;margin:-30px 0 0 -16px;z-index:3;transition:left 3.5s linear,top 3.5s linear;pointer-events:none}
.mini .body{animation:fl 2.2s ease-in-out infinite;width:100%;height:100%}
.mini .nm{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;background:#0009;border-radius:6px;padding:0 4px;white-space:nowrap}
.mini .hi{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);font-size:10px;background:#fff;color:#222;border-radius:8px;padding:1px 6px;white-space:nowrap;opacity:0;transition:opacity .3s}
.mini .hi.on{opacity:1}
.tap{position:absolute;width:30px;height:12px;margin:-6px 0 0 -15px;border:2px solid #ffffffaa;border-radius:50%;z-index:2;pointer-events:none;animation:tap .7s ease-out forwards}
@keyframes tap{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}

.nav{display:flex;gap:2px;padding:6px;background:var(--card);border-top:1px solid var(--ln);position:relative;z-index:8}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:10px;cursor:pointer}
.nav button.on{background:#58c2a622;color:var(--ac)}
.nav i{font-style:normal;font-size:19px}

.inside{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;z-index:9;clip-path:circle(0% at var(--cx,50%) var(--cy,50%));transition:clip-path .55s cubic-bezier(.6,0,.3,1);visibility:hidden}
.inside.open{clip-path:circle(150% at var(--cx,50%) var(--cy,50%));visibility:visible}
.inside .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);background:var(--hb,#1f1c2b)}
.back{border:1px solid #ffffff33;background:#0005;color:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.inside h2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0;color:#fff}
.inside .body2{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box{border:1px solid var(--ln);border-radius:14px;padding:12px;background:#ffffff08;animation:rise .45s both}
.box:nth-child(2){animation-delay:.08s}.box:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.box h3{margin:0 0 6px;font-size:14px}
.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06231c}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;background:var(--ac);color:#06231c;font:inherit;font-weight:700;text-align:center}
.big{font-family:var(--f-disp);font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gb{border:1px solid var(--ln);border-radius:12px;background:#ffffff08;color:var(--silver);padding:14px 6px;font:inherit;cursor:pointer}
.ex{font-size:11px;color:var(--warm);margin:0}
/* 집 안 배경 그림 (대장님이 만든 그림) */
.hero{position:relative;height:50%;flex-shrink:0;overflow:hidden;display:none;background:#000}
.hasHero .hero{display:block}
.heroImg{position:absolute;inset:-6%;background:center 40%/cover no-repeat;animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-2%,-1%)}}
.warm{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 35%,#ffb45a55,#0000 55%),radial-gradient(circle at 64% 30%,#ffd28a44,#0000 30%);mix-blend-mode:screen;animation:warm 4s ease-in-out infinite}
@keyframes warm{0%,100%{opacity:.9}43%{opacity:.75}45%{opacity:1}47%{opacity:.8}}
.ray{position:absolute;left:-20%;top:-10%;width:70%;height:140%;background:linear-gradient(100deg,#0000 30%,#ffe2a833 45%,#0000 60%);animation:ray 7s ease-in-out infinite;mix-blend-mode:screen}
@keyframes ray{50%{transform:translateX(18%);opacity:.6}}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff1c9;box-shadow:0 0 6px 1px #ffd98aaa;animation:dust linear infinite;opacity:0}
@keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(30px,-140px);opacity:0}}
.shade{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(#0000,var(--card))}
.heroGhost{position:absolute;right:8%;bottom:16%;width:74px;height:80px;animation:fl 2.6s ease-in-out infinite}
.heroGhost .say{position:absolute;bottom:100%;right:0;background:#fff;color:#222;font-size:12px;border-radius:10px;padding:4px 9px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px #0008;animation:rise .5s .5s both}
.hasHero .hd{position:absolute;left:0;right:0;top:0;z-index:3;background:linear-gradient(#000b,#0000);border:0}
.hasHero .body2{position:relative;margin-top:-22px;border-radius:20px 20px 0 0;background:var(--card);box-shadow:0 -8px 20px #0007;flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="phone">
  <p class="note"><b>미리보기 시안 4</b> · 실제 앱이 아니고 숫자는 모두 예시예요.<br>🔊 음악을 켜고, 땅을 눌러 유령을 움직여 보세요. 🧴·🤝 집 안에는 대장님이 만든 작업실 그림이 나와요.</p>
  <div class="screen">
    <div class="top"><div><h1>유령 마을</h1><div class="who">길동님 · 👻 뭉치 (아기 유령)</div></div><span class="sp"></span><button class="ib" id="snd" type="button" aria-pressed="false">🔇 음악</button><button class="ib" id="dn" type="button">☀️ 낮</button></div>
    <div class="village" id="vil">
      <div class="cam" id="cam">
        <svg class="scene" id="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <canvas id="fx"></canvas>
        <button class="house" type="button" data-h="toss" style="left:3%;top:12%;width:31%;animation-delay:-1s"><span class="bub">🔔 승인 1건</span></button>
        <button class="house" type="button" data-h="cream" style="right:3%;top:10%;width:33%;animation-delay:-2s"></button>
        <button class="house" type="button" data-h="share" style="left:2%;top:44%;width:31%;animation-delay:-3s"><span class="bub y">입금 예정</span></button>
        <button class="house" type="button" data-h="game" style="right:2%;top:43%;width:32%;animation-delay:-4s"><span class="bub y">오늘 12/30</span></button>
        <button class="house" type="button" data-h="supply" style="left:13%;top:72%;width:27%;animation-delay:-5s"></button>
        <button class="house" type="button" data-h="lotto" style="right:13%;top:72%;width:27%;animation-delay:-.5s"><span class="bub">🎟 2장</span></button>
        <div class="me" id="me" style="left:50%;top:58%"><div class="say" id="say">오늘도 화이팅!</div><div class="tilt" id="tilt"><div class="body" id="mebody"></div></div><div class="shadow"></div></div>
      </div>
    </div>
    <nav class="nav">
      <button class="on" type="button"><i>🏘</i>마을</button>
      <button type="button" data-go="cream"><i>🧾</i>판매입력</button>
      <button type="button" data-go="toss"><i>🤝</i>토스</button>
      <button type="button" data-go="share"><i>💳</i>쉐어비</button>
      <button type="button"><i>☰</i>더보기</button>
    </nav>
    <section class="inside" id="in" aria-live="polite"><div class="hd"><button class="back" id="bk" type="button">← 마을로</button><h2 id="ttl"></h2></div><div class="hero" id="hero"><div class="heroImg" id="heroImg"></div><div class="ray"></div><div class="warm"></div><div id="dust"></div><div class="shade"></div><div class="heroGhost" id="heroGhost"></div></div><div class="body2" id="bd"></div></section>
  </div>
  <p class="note">아래 탭은 그대로 남겨서, 바쁠 때는 마을을 거치지 않고 바로 판매입력·토스로 갈 수 있어요.</p>
</div>

<script>
const $=s=>document.querySelector(s);
let DAY=false;
const H={
  toss:{n:'토스하우스',sign:'🤝',hb:'#3b2f73',bg:'studio.jpg',hi:'작업 넘겨줄 손님 있어? 🤝'},cream:{n:'타투크림하우스',sign:'🧴',hb:'#7a2a4a',bg:'studio.jpg',hi:'어서 와! 오늘도 크림 팔자 🧴'},share:{n:'쉐어비하우스',sign:'💳',hb:'#1e5246'},
  game:{n:'게임센터',sign:'🎮',hb:'#6b3d0f'},supply:{n:'창고',sign:'📦',hb:'#4a3d33'},lotto:{n:'복권가게',sign:'🎁',hb:'#6b5410'}
};
const W='#ffcf6b';
const HS={
// 토스하우스: 보라 박공지붕, 굴뚝 연기, 둥근 창 두 개, 깃발
toss:()=>`<svg viewBox="0 0 140 130"><rect x="98" y="18" width="12" height="26" fill="#5b4a8c"/><circle class="smoke" cx="104" cy="14" r="6" fill="#ddd8f0"/><circle class="smoke" style="animation-delay:-1.7s" cx="104" cy="14" r="5" fill="#ddd8f0"/><circle class="smoke" style="animation-delay:-3.4s" cx="104" cy="14" r="7" fill="#ddd8f0"/>
<path d="M8 62 70 14l62 48z" fill="#5a49b8"/><path d="M8 62 70 14l62 48" fill="none" stroke="#3b2f73" stroke-width="4"/>${[0,1,2,3].map(i=>`<path d="M${22+i*10} ${52-i*8}h${96-i*20}" stroke="#4a3ba0" stroke-width="2"/>`).join('')}
<rect x="18" y="58" width="104" height="62" rx="3" fill="#e7e1fb"/><rect x="18" y="58" width="104" height="6" fill="#cfc6f2"/>
<circle class="win" cx="42" cy="84" r="11" fill="${W}"/><path d="M31 84h22M42 73v22" stroke="#7a6bb8" stroke-width="2"/><circle class="win" cx="98" cy="84" r="11" fill="${W}"/><path d="M87 84h22M98 73v22" stroke="#7a6bb8" stroke-width="2"/>
<path class="door" d="M58 120v-24a12 12 0 0 1 24 0v24z" fill="#3b2f73"/><circle cx="76" cy="108" r="2" fill="${W}"/>
<rect x="56" y="30" width="28" height="18" rx="4" fill="#fff"/><text x="70" y="44" font-size="13" text-anchor="middle">🤝</text>
<path d="M20 58v-20" stroke="#3b2f73" stroke-width="2"/><path d="M20 38l14 4-14 4z" fill="#ff7aa8"><animateTransform attributeName="transform" type="skewY" values="0;6;0" dur="1.5s" repeatCount="indefinite"/></path></svg>`,
// 타투크림하우스: 분홍 가게, 줄무늬 차양, 큰 크림통 간판, 진열창
cream:()=>`<svg viewBox="0 0 150 140"><rect x="14" y="40" width="122" height="92" rx="4" fill="#ffe3ec"/><path d="M10 40h130l-8-22H18z" fill="#ff7aa8"/>
<path d="M14 40h122v14H14z" fill="#fff"/>${[0,1,2,3,4,5,6,7].map(i=>`<path d="M${14+i*15.25} 40h7.6v14q-3.8 5-7.6 0z" fill="#ff5f96"/>`).join('')}
<g transform="translate(75 6)"><rect x="-14" y="0" width="28" height="30" rx="5" fill="#fff" stroke="#c21f6b" stroke-width="2"/><rect x="-16" y="-4" width="32" height="8" rx="3" fill="#c21f6b"/><text x="0" y="22" font-size="9" text-anchor="middle" fill="#c21f6b" font-weight="700">CREAM</text></g>
<rect x="22" y="64" width="46" height="34" rx="3" fill="${W}" class="win"/><rect x="22" y="64" width="46" height="34" rx="3" fill="none" stroke="#c21f6b" stroke-width="2"/>${[0,1,2].map(i=>`<rect x="${28+i*13}" y="${80-i*2}" width="9" height="${14+i*2}" rx="2" fill="#fff" stroke="#ff7aa8"/>`).join('')}
<path class="door" d="M86 132v-50h40v50z" fill="#8a2c55"/><rect x="92" y="88" width="28" height="18" rx="3" fill="${W}" opacity=".85"/><circle cx="120" cy="114" r="2" fill="${W}"/>
<text x="106" y="124" font-size="8" text-anchor="middle" fill="#ffe3ec">OPEN</text></svg>`,
// 쉐어비하우스: 초록 은행, 기둥 4개, 삼각 박공, 금고 문
share:()=>`<svg viewBox="0 0 140 130"><path d="M6 46 70 12l64 34z" fill="#2f7e6b"/><path d="M20 44 70 18l50 26z" fill="#d4f0e6"/><circle cx="70" cy="34" r="9" fill="#fff"/><text x="70" y="38" font-size="10" text-anchor="middle">💳</text>
<rect x="6" y="46" width="128" height="8" fill="#2f7e6b"/><rect x="12" y="54" width="116" height="62" fill="#e9f7f1"/>
${[0,1,2,3].map(i=>`<rect x="${20+i*30}" y="56" width="10" height="58" fill="#fff"/><rect x="${18+i*30}" y="54" width="14" height="4" fill="#cfe7de"/><rect x="${18+i*30}" y="112" width="14" height="4" fill="#cfe7de"/>`).join('')}
<rect class="door" x="55" y="74" width="30" height="42" rx="4" fill="#3c8d7a"/><circle cx="70" cy="94" r="9" fill="none" stroke="#d4af37" stroke-width="3"/><path d="M70 88v12M64 94h12" stroke="#d4af37" stroke-width="2"/>
<rect class="win" x="33" y="70" width="10" height="16" rx="2" fill="${W}"/><rect class="win" x="97" y="70" width="10" height="16" rx="2" fill="${W}"/>
<rect x="2" y="116" width="136" height="8" rx="2" fill="#2f7e6b"/></svg>`,
// 게임센터: 주황 오락실, 네온 간판, 아케이드 기계 창
game:()=>`<svg viewBox="0 0 140 130"><rect x="12" y="34" width="116" height="88" rx="10" fill="#2a1c3a"/><rect x="12" y="34" width="116" height="88" rx="10" fill="none" stroke="#f2a33a" stroke-width="3"/>

let AC=null,bus=null,timer=null,step=0,nextT=0,musicOn=false,noise=null;
const N=n=>440*Math.pow(2,(n-69)/12),BPM=92,S16=60/BPM/4;
// 8마디 x 2 (A단조): 코드 진행과 멜로디(16분음표 16칸 = 1마디)
const CHD=[[57,60,64],[53,57,60],[48,52,55,59],[55,59,62],[57,60,64],[53,57,60,64],[52,56,59,62],[52,56,59],
          [50,53,57],[57,60,64],[53,57,60],[52,56,59],[50,53,57,60],[48,52,55],[52,56,59,62],[57,60,64]];
const M=s=>s.split(' ').map(x=>x=='.'?0:+x);
const MEL=[M('76 . . 81 . 79 76 . 72 . . 74 . 76 . .'),M('77 . . 76 . 72 . . 69 . . 72 . . . .'),M('76 . 79 . 84 . 83 . 81 . 79 . 76 . . .'),M('74 . . 79 . 74 . 71 . . 74 . 79 . . .'),
 M('76 . . 81 . 79 76 . 84 . . 83 . 81 . .'),M('81 . 77 . 76 . 74 . 72 . . 74 . . . .'),M('71 . 74 . 76 . 80 . 83 . . 80 . 76 . .'),M('76 . . . 74 . . . 71 . . . . . . .'),
 M('77 . . 81 . 77 74 . 77 . . 81 . 86 . .'),M('84 . . 81 . 76 . . 81 . 84 . 88 . . .'),M('84 . 81 . 77 . 81 . 84 . . 86 . 84 . .'),M('83 . . 80 . 76 . . 80 . 83 . 86 . . .'),
 M('86 . 84 . 81 . 77 . 84 . 81 . 77 . 74 .'),M('76 . 79 . 84 . 79 . 76 . 72 . 79 . . .'),M('80 . 83 . 86 . 83 . 80 . 76 . 74 . 71 .'),M('69 . . . 72 . . . 76 . . . 81 . . .')];
function voice(type,f,t,dur,vol,att,dest,detune){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(detune)o.detune.value=detune;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0004,t+dur);o.connect(g);g.connect(dest||bus);o.start(t);o.stop(t+dur+.1)}
function box(n,t,v){const f=N(n),d=(Math.random()-.5)*6;voice('sine',f,t,2.2,v,.004,null,d);voice('sine',f*2,t,.9,v*.3,.004);voice('sine',f*3.01,t,.35,v*.12,.002);voice('triangle',f*4.2,t,.12,v*.05,.001)}
function pad(ch,t,dur){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1100,t+dur*.5);lp.frequency.linearRampToValueAtTime(600,t+dur);lp.Q.value=.6;lp.connect(bus);
 ch.forEach(n=>{[-7,7].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=N(n);o.detune.value=dt;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+.5);g.gain.setValueAtTime(.022,t+dur-.3);g.gain.linearRampToValueAtTime(0,t+dur+.4);o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+.5)})})}
function bass(n,t){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;o.type='triangle';o.frequency.value=N(n);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(lp);lp.connect(g);g.connect(bus);o.start(t);o.stop(t+.6)}
function hat(t,v){const s=AC.createBufferSource();s.buffer=noise;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.05);s.connect(hp);hp.connect(g);g.connect(bus);s.start(t);s.stop(t+.06)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.3)}
function snap(t){const s=AC.createBufferSource();s.buffer=noise;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.8;const g=AC.createGain();g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);s.connect(bp);bp.connect(g);g.connect(bus);s.start(t);s.stop(t+.14)}
function sched(){while(nextT<AC.currentTime+.3){const bar=Math.floor(step/16)%16,i=step%16,loop2=Math.floor(step/256)%2,ch=CHD[bar],n=MEL[bar][i];
 if(i==0)pad(ch,nextT,S16*16);
 if(n)box(n,nextT,.13);
 if(loop2&&i%2==0&&!n)box(ch[(i/2)%ch.length]+24,nextT,.025);
 if(i==0||i==10)bass(ch[0]-12,nextT);if(i==6||i==14)bass(ch[0],nextT);
 if(bar>=2||loop2){if(i%4==0)hat(nextT,.035);if(i%2==1)hat(nextT,.012);if(i==0||i==8)kick(nextT);if(i==4||i==12)snap(nextT)}
 nextT+=S16;step++}}
function musicStart(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AC=new C();
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(AC.destination);
 const len=AC.sampleRate*2.6,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
 const rev=AC.createConvolver();rev.buffer=ir;const wet=AC.createGain();wet.gain.value=.35;rev.connect(wet);wet.connect(comp);
 bus=AC.createGain();bus.gain.value=0;bus.connect(comp);bus.connect(rev);
 noise=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1}
 AC.resume&&AC.resume();bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.setValueAtTime(bus.gain.value,AC.currentTime);bus.gain.linearRampToValueAtTime(.8,AC.currentTime+1.5);nextT=AC.currentTime+.08;step=0;timer=setInterval(sched,50);return true}
function musicStop(){if(!AC)return;bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.setValueAtTime(bus.gain.value,AC.currentTime);bus.gain.linearRampToValueAtTime(0,AC.currentTime+.8);setTimeout(()=>{clearInterval(timer);timer=null},850)}
function sfx(kind){if(!musicOn||!AC)return;const t=AC.currentTime+.01;if(kind=='door'){[72,76,79,84,88].forEach((n,i)=>box(n,t+i*.06,.12))}else if(kind=='back'){[84,79,76,72].forEach((n,i)=>box(n,t+i*.06,.1))}else if(kind=='step'){voice('sine',N(84),t,.25,.06,.005);voice('sine',N(91),t+.05,.25,.04,.005)}else{[88,91,96].forEach((n,i)=>box(n,t+i*.05,.09))}}
$('#snd').addEventListener('click',()=>{musicOn=!musicOn;const b=$('#snd');if(musicOn){if(!musicStart()){musicOn=false;b.textContent='소리 안 됨';return}b.textContent='🔊 음악';b.classList.add('on')}else{musicStop();b.textContent='🔇 음악';b.classList.remove('on')}b.setAttribute('aria-pressed',musicOn)});

  cream:`<div class="box"><h3>🧴 크림 판매 입력</h3><div class="row"><span class="chip on">정상판매</span><span class="chip">리뷰이벤트</span><span class="chip">서비스</span><span class="chip">샘플</span></div><p class="mu" style="margin:8px 0 4px">제품</p><div class="row"><span class="chip on">허니구 대</span><span class="chip">허니구 소</span></div><p class="mu" style="margin:8px 0 4px">결제</p><div class="row"><span class="chip on">현금</span><span class="chip">카드</span><span class="chip">이체</span></div></div><button class="btn" type="button">저장하고 유령 밥 주기 🍙</button><p class="ex">예시 화면 · 실제로는 지금 판매입력 화면이 그대로 들어가요</p>`,
  toss:`<div class="box"><h3>🔔 승인 요청 1건</h3><p class="mu">타투님이 보낸 토스 · 손님 김○○ · 레터링</p><div class="row" style="margin-top:8px"><span class="chip on">승인</span><span class="chip">반려</span></div></div><div class="box"><h3>이번 달 토스</h3><div class="grid2"><div><span class="mu">받은 토스</span><div class="big">3회</div></div><div><span class="mu">보낸 토스</span><div class="big">1회</div></div></div></div><button class="btn" type="button">＋ 토스 보내기</button><p class="ex">예시 화면</p>`,

  game:`<div class="box"><h3>🎮 오늘 받은 포인트 12 / 30</h3><p class="mu">포인트로 뭉치가 자라고 꾸미기를 살 수 있어요</p></div><div class="grid2"><button class="gb" type="button">👻 유령 점프</button><button class="gb" type="button">🍬 사탕 받기</button><button class="gb" type="button">🪦 무덤 숨바꼭질</button><button class="gb" type="button">🎯 잉크 찍기</button></div><div class="box"><h3>🏆 이번 주 게임왕</h3><p class="mu">🥇 몽글 54 · 🥈 뭉치 42 · 🥉 타투 30</p></div><p class="ex">예시 화면</p>`,
  supply:`<div class="box"><h3>📦 비품 · 소모품</h3><p class="mu">니들 RL 3 · <b style="color:var(--warm)">부족</b></p><p class="mu">그린솝 · 정상</p><p class="mu">랩 · <b style="color:var(--pink)">품절</b></p></div><button class="btn" type="button">요청하기</button><p class="ex">예시 화면</p>`,
  lotto:`<div class="box"><h3>🎟 긁지 않은 복권 2장</h3><div class="row"><span class="chip">🎟 매일 복권</span><span class="chip">🎟 매일 복권</span></div></div><div class="box"><h3>🏆 내 레벨</h3><p class="mu">Lv.1 · 랭킹 3위 / 12명 · 다음 레벨업 10/15</p></div><p class="ex">예시 화면</p>`
};
const ins=$('#in'),bd=$('#bd'),ttl=$('#ttl'),cam=$('#cam');let curH=null,busy=false;
function enter(k,el){if(busy)return;busy=true;const vr=$('#vil').getBoundingClientRect(),r=el.getBoundingClientRect(),hx=(r.left+r.width/2-vr.left)/vr.width*100,hy=(r.top+r.height*.7-vr.top)/vr.height*100;
 const house=el.classList.contains('house')?el:document.querySelector(`.house[data-h="${k}"]`);curH=house;house.classList.remove('hit');void house.offsetWidth;house.classList.add('hit','open');
 moveTo(hx,Math.min(96,hy+6));sfx('door');
 setTimeout(()=>{const hr=house.getBoundingClientRect(),x=hr.left+hr.width/2-vr.left,y=hr.top+hr.height*.75-vr.top;cam.style.transformOrigin=`${x}px ${y}px`;cam.style.transform='scale(2.6)';cam.classList.add('zoom')},380);
 setTimeout(()=>{const s=$('.screen').getBoundingClientRect();ins.style.setProperty('--cx',((vr.left-s.left)+vr.width*hx/100)/s.width*100+'%');ins.style.setProperty('--cy',((vr.top-s.top)+vr.height*hy/100)/s.height*100+'%');
  ins.classList.toggle('hasHero',!!H[k].bg);if(H[k].bg){$('#heroImg').style.backgroundImage=`url(${H[k].bg})`;$('#heroGhost').innerHTML=`<div class="say">${H[k].hi}</div>`+ghost('#f4f1ea','<path d="M60 16l-17-9v18zM60 16l17-9v18z" fill="#ff5fa2"/><circle cx="60" cy="16" r="4.5" fill="#c21f6b"/>');const du=$('#dust');du.innerHTML='';for(let i=0;i<16;i++){const d=document.createElement('span');d.className='dust';d.style.left=rnd(5,90)+'%';d.style.top=rnd(35,95)+'%';d.style.animationDuration=rnd(5,10)+'s';d.style.animationDelay=(-rnd(0,10))+'s';du.appendChild(d)}}
  ins.style.setProperty('--hb',H[k].hb);ttl.textContent=H[k].sign+' '+H[k].n;bd.innerHTML=IN[k];ins.classList.add('open');busy=false;$('#bk').focus()},900)}
document.querySelectorAll('.house').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();enter(b.dataset.h,b)}));
document.querySelectorAll('.nav [data-go]').forEach(b=>b.addEventListener('click',()=>enter(b.dataset.go,document.querySelector(`.house[data-h="${b.dataset.go}"]`))));
$('#bk').addEventListener('click',()=>{ins.classList.remove('open');sfx('back');setTimeout(()=>{cam.style.transform='';cam.classList.remove('zoom');if(curH)curH.classList.remove('open');moveTo(50,58)},250)});
