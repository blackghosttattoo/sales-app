<style>

:root{--bg:#f3f1f6;--card:#ffffff;--fg:#1d1a24;--mu:#6c6779;--ln:#e2dee9;--ac:#6b46c1;--acf:#ffffff;--ok:#1f9d6a;--warn:#c2410c;--soft:#efeaf8;
 --fd:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141219;--card:#1f1c27;--fg:#efecf5;--mu:#a7a1b6;--ln:#332e3f;--ac:#a98bff;--acf:#141219;--ok:#4cd28a;--warn:#ff9a62;--soft:#2a2438;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141219;--card:#1f1c27;--fg:#efecf5;--mu:#a7a1b6;--ln:#332e3f;--ac:#a98bff;--acf:#141219;--ok:#4cd28a;--warn:#ff9a62;--soft:#2a2438;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}

.tabs button.on,.chip.on,.lang button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}

input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;box-sizing:border-box;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:15px var(--fb);background:var(--bg);color:var(--fg)}

.sm{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font:500 13px var(--fb);cursor:pointer}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px}.note.w{background:color-mix(in srgb,var(--warn) 12%,transparent)}

.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.list .it:first-of-type{border-top:0}.it>div{flex:1;min-width:0}

.link{display:flex;gap:10px;align-items:center;border:1px dashed var(--ln);border-radius:12px;padding:10px}.link>div{flex:1;min-width:0}
.done{text-align:center;padding:28px 12px}.done .g{font-size:52px}
table{border-collapse:collapse;width:100%;font-size:13.5px}td{border-top:1px solid var(--ln);padding:8px 4px;vertical-align:top}td:first-child{color:var(--mu);width:34%}
.tw{overflow-x:auto}

.ck input:disabled{opacity:.35}[hidden]{display:none!important}
.sh{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

.shc{overflow-y:auto;flex:1;min-height:0;font-size:14.5px;line-height:1.7;padding-right:4px}.shc ul{padding-left:18px;margin:6px 0}.shc b{color:var(--ac)}

.mat{border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sig{background:#fff}#load{text-align:center;padding:40px 12px}

<script>(()=>{const e=e=>document.querySelector(e),t=e=>[...document.querySelectorAll(e)];const n={ko:{intro:"본 동의서는 문신으로 생길 수 있는 부작용·후유증·사후관리 방법과 유의사항을 안내하고, 손님의 자발적인 동의를 받기 위한 것이에요. 아래 내용을 천천히 읽고, 궁금한 점은 작업자에게 꼭 물어본 뒤 결정해 주세요. 만 19세 미만은 보호자 동의서가 따로 필요해요.",s1:"1. 이용자 정보",name:"성명 *",birth:"생년월일 8자리 *",bph:"예: 19950512",phone:"연락처 *",gender:"성별",addr:"주소 *",emg:"응급 시 연락처 *",enone:"응급 연락처를 남기지 않을게요. 응급 상황에서 연락할 사람이 없을 수 있다는 것을 이해해요. (거부한 기록이 서명과 함께 남아요)",emgwhy:"🔒 보건복지부 「문신시술 표준지침」 동의서 서식에 따라 꼭 받는 항목이에요. 시술 중이나 직후에 손님이 쓰러지거나 몸이 많이 안 좋아지는 등 응급 상황일 때만 연락해요. 그 밖의 목적(홍보·안내 문자·확인 전화 등)으로는 절대 쓰지 않고, 따로 연락하지도 않아요. 다른 정보와 같은 기간만 보관하고 지워요.",ename:"이름",ephone:"전화번호",erel:"관계",sns:"SNS 아이디(선택, 작업 사진 보내 드려요)",visit:"방문",routeL:"어떻게 알고 오셨어요? (선택)",s2:"2. 문신행위",s2d:"작업자가 미리 적어 둔 내용이에요. 맞는지 확인해 주세요.",artist:"담당 타투이스트",part:"시술 부위",date:"시술(예정)일",design:"도안·범위",s3:"3. 건강상태 확인",s3d:'질문마다 예/아니오를 눌러 주세요. "예"면 내용을 적어 주세요.',bbnote:"혈액매개감염병이 있으면 의료기관 소견서를 확인한 뒤 시술 여부를 정해요. 작업자에게 말씀해 주세요.",hstate:"본인은 위 내용을 사실대로 적었으며, 건강상의 이유로 시술이 거부되거나 중단될 수 있음을 이해했어요.",s4:"4. 설명 확인 및 동의",s4d:"작업자에게 설명을 듣고 충분히 이해했으면 체크해 주세요.",copy:"※ 동의서 사본을 요청할 수 있으며, 정당한 사유가 없으면 거부하지 않아요.",sS:"5. 쉐어 스튜디오 안내",shopi:'블랙고스트 타투는 여러 <b>독립 타투이스트</b>가 공간을 함께 쓰는 쉐어 스튜디오예요.<ul style="margin:6px 0;padding-left:18px"><li>도안 상담·시술·결과·사후 상담은 <b>담당 타투이스트</b>가 직접 맡아 진행하고 책임져요. 샵을 통해 예약이나 연결을 받은 경우도 같아요.</li><li>샵(대표)은 공간·위생 시설·예약 안내를 맡고, 법령에 따른 업소의 의무(위생 관리, 기록 보관, 책임보험 등)를 지켜요.</li><li>문제가 생기면 담당 타투이스트에게 먼저 연락해 주세요. 해결이 어려우면 샵 대표에게도 연락할 수 있어요.</li></ul><span class="mu">이 안내는 법률이 정한 책임을 바꾸거나 줄이지 않아요.</span>',shopok:"시술은 담당 타투이스트가 직접 진행하고 책임진다는 안내를 들었어요.",s5:"6. 개인정보",photo:"작업 사진을 SNS·홍보에 써도 될까요? (얼굴은 나오지 않게 해요)",news:"이벤트·관리 안내 문자를 받을까요?",s6:"7. 서명",final:"본인은 「문신사법」 제19조 및 같은 법 시행규칙 제18조에 따라 문신의 부작용, 후유증, 사후관리, 유의사항 등에 대하여 충분한 설명을 들어 이해하였으므로 위와 같이 문신행위를 하는 것에 자발적인 의사로 동의합니다.",s6d:"아래 칸에 손가락으로 서명해 주세요.",clear:"다시 쓰기",submit:"동의하고 제출하기",thanks:"제출됐어요! 감사합니다",thanksd:"담당 작업자에게 바로 전달됐어요. 이 창은 닫으셔도 돼요.",yes:"예",no:"아니오",yA:"동의",nA:"동의 안 함",new:"처음 방문",re:"다시 방문",detail:"내용 (예: 부위·연도·색상·약 이름)",gen:["선택 안 함","여성","남성","기타"],rel:["부모","배우자","자녀","친척","기타"],route:["네이버","구글","인스타그램","틱톡","카카오","지인 소개","체험단","지나가다","기타"],hq:["문신을 받은 적이 있나요? (부위·연도)","문신 후 이상 증상(염증, 붓기, 피부색 변화 등)이 있었나요?","문신 염료에 알레르기(발진, 가려움, 붓기 등)가 있었나요? (색상)","시술 부위에 상처, 염증, 발진 등 피부 이상이 있나요?","최근 3개월 안에 피부과 치료(염증, 건선, 습진, 아토피 등)를 받았나요?","흉터가 붉게 부풀어 오르거나(켈로이드) 피부가 잘 붓거나 과민반응을 보인 적이 있나요?","알레르기가 있는 물질(금속, 약, 알코올, 라텍스 등)이 있나요?","현재 타인에게 전파될 수 있는 혈액매개감염병(B형·C형 간염, 에이즈 등)으로 진단받았거나 치료 중인가요?","몸이 갑자기 떨리거나 의식을 잃은 적이 있거나, 뇌전증 등 뇌신경계 질환이 있나요?","오늘 아픈 곳이 있거나 발열, 오한, 심한 피로감이 있나요?","현재 복용 중인 약(항응고제, 아스피린, 면역억제제 등)이 있나요? (약 이름)","최근 24시간 안에 술을 마셨나요?","임신 중이거나 수유 중인가요?"],dz:"다음 질병으로 진단받았거나 약물 치료 중인가요?",dzl:["뇌졸중(중풍)","심근경색·협심증","고혈압","당뇨병","고지혈증","폐결핵","기타","해당 없음"],agree:["문신행위의 방법 및 과정에 대해 충분한 설명을 들었어요.","문신행위 후 생길 수 있는 부작용(붉어짐·붓기·통증·가려움·물집·알레르기·켈로이드 등), 후유증, 사후관리에 대해 충분한 설명을 들었어요.","문신행위 전후에 지켜야 할 유의사항에 대해 충분한 설명을 들었어요.","작업 후 관리 방법을 안내받았어요. 관리 방법은 담당 작업자의 안내를 따를게요.","문신행위는 저의 자발적 의사에 따른 것이에요.","디자인·크기·위치를 확인했어요. 작업이 끝난 뒤에는 바꾸거나 되돌리기 어렵다는 것을 알아요.","바늘·색소컵 등 피부에 닿는 도구는 멸균된 일회용을 쓰고, 시술 직전에 제 앞에서 새 포장을 뜯는다는 안내를 들었어요. 궁금하면 포장을 보여 달라고 할 수 있어요.","컬러 염료는 알레르기 반응이 생길 수 있다는 설명을 들었어요.","피부 상태와 관리에 따라 결과가 조금씩 다를 수 있고, 안내받은 관리 방법을 지키지 않아 생긴 문제는 작업자에게 책임을 묻지 않아요.","만 19세 이상이에요."],priv:['<b>[필수] 개인정보 수집·이용</b><br><span class="mu">항목: 성명·생년월일·성별·연락처·주소·응급 연락처·SNS·서명 · 목적: 문신행위 기록·사후관리·연락 · 관련 법령에 따라 일정 기간 보관 후 삭제</span>','<b>[필수] 건강정보(민감정보) 수집·이용</b><br><span class="mu">항목: 건강상태 확인 내용 · 목적: 안전한 시술 판단 · 관련 법령에 따른 기간 보관 후 삭제</span>'],sending:"보내는 중…",fail:"보내지 못했어요. 이미 제출했거나 QR 시간(30분)이 지났을 수 있어요. 인터넷을 확인하고 다시 눌러 주세요. 계속 안 되면 작업자에게 말해 주세요.",minor:"만 19세 미만은 보호자 동의서가 따로 필요해요. 작업자에게 말해 주세요.",err:"*가 붙은 칸(생년월일은 8자리 숫자), 건강 질문 전부, 필수 체크, 서명을 확인해 주세요.",exOpen:"📖 설명 보기",exRead:"✅ 설명 읽음",exWait:"🙋 작업자에게 설명을 들어 주세요",exDemo:"✅ 작업자에게 설명 들었어요",shHint:"끝까지 내려 읽으면 [이해했어요]를 누를 수 있어요.",shHint2:"다 읽었어요. 이해했으면 눌러 주세요.",shOk:"이해했어요 ✓ 동의",shAsk:"🙋 작업자에게 직접 설명 듣기",shX:"닫기",ex:{0:["문신 시술 방법과 과정","<ul><li><b>상담</b> — 도안·크기·위치를 정하고 확인해요.</li><li><b>준비</b> — 시술 부위를 소독하고, 필요하면 털을 정리해요.</li><li><b>도안 옮기기</b> — 피부에 도안 선(스텐실)을 옮겨 위치를 다시 확인해요.</li><li><b>시술</b> — 멸균 일회용 바늘로 피부 바로 아래층에 염료를 넣어요. 라인 → 명암 → 색 순서로 진행해요.</li><li><b>마무리</b> — 다시 소독하고 보호 필름(랩)을 붙여요.</li></ul>시술 중 따끔하거나 쓰라린 느낌이 있을 수 있어요. 아프거나 쉬고 싶으면 언제든 말해 주세요. 시간은 크기와 도안에 따라 달라져요."],1:["부작용·후유증·사후관리",'<b>흔한 반응 (대부분 1~2주 안에 좋아져요)</b><ul><li>붉어짐·붓기·열감·진물: 2~3일</li><li>가려움·각질·딱지: 1~2주 — 긁거나 떼지 마세요</li></ul><b>바로 연락하거나 병원에 가야 할 때</b><ul><li>붓기·통증이 점점 심해지거나, 고름·열이 날 때(감염)</li><li>발진·심한 가려움이 계속될 때(알레르기 — 몇 달 뒤에 생기기도 해요)</li></ul><b>그 밖에 생길 수 있는 것</b><ul><li>켈로이드(흉터가 부풀어 오름), 잉크 번짐, 색 빠짐·얼룩</li><li>문신은 영구적이에요. 지우려면 레이저를 여러 번 받아야 하고 흉터가 남을 수 있어요.</li></ul><p class="mu">관리 방법은 아래 <b>‘작업 후 관리 방법’</b> 설명에서 자세히 볼 수 있어요.</p>'],3:["작업 후 관리 방법",'<p class="note">💡 관리 방법은 <b>작업자마다 조금씩 달라요.</b> 크림으로 관리하는 방법, 타투 패치(투명 보호 필름·세컨드 스킨)를 붙여 관리하는 방법 등이 있어요. <b>담당 작업자가 알려 준 방법을 먼저 따라 주세요.</b></p><b>기본 관리 방법</b><ul><li>손을 깨끗이 씻은 뒤에 시술 부위를 만져요.</li><li>보호 필름(랩·패치)은 작업자가 알려 준 시간에 떼요.</li><li>미지근한 물과 순한 비누로 가볍게 씻고, 깨끗한 수건이나 휴지로 톡톡 두드려 말려요.</li><li>크림이나 연고는 아주 얇게 발라요. 너무 많이 바르면 오히려 늦게 나아요.</li><li>딱지·각질은 긁거나 떼지 말고 저절로 떨어지게 두세요.</li></ul><b>2주 동안 피해 주세요</b><ul><li>사우나·목욕탕·찜질방·수영장·바닷물</li><li>오래 물에 담그기(반신욕·욕조 목욕)</li><li>직사광선·태닝, 꽉 끼는 옷과 마찰</li><li>과음, 심한 운동으로 땀을 많이 흘리기</li></ul><b>다 나은 뒤에도</b><ul><li>햇빛을 오래 받으면 색이 빨리 바래요. 외출할 땐 자외선 차단제를 발라 주세요.</li></ul><p class="note">📞 관리하다가 궁금한 점이나 걱정되는 점이 있으면 <b>언제든 연락 주세요.</b> 사진을 찍어 보내 주시면 더 빨리 알려 드릴 수 있어요.</p>'],2:["시술 전후 유의사항","<b>시술 전</b><ul><li>전날과 당일엔 술을 마시지 마세요(피가 잘 멈추지 않아요).</li><li>충분히 자고 식사를 하고 오세요.</li><li>아스피린 등 피를 묽게 하는 약은 먹기 전에 의사와 상담해 주세요.</li><li>시술 부위가 편하게 드러나는 옷을 입어 주세요.</li></ul><b>시술 후</b><ul><li>‘작업 후 관리 방법’을 지켜 주세요.</li><li>꽉 끼는 옷이나 마찰을 피해 주세요.</li><li>이상이 있으면 사진을 찍어 작업자에게 바로 연락해 주세요.</li></ul>"],5:["디자인 확인과 문신의 영구성","<ul><li>시술 전에 도안·크기·위치를 거울로 꼭 확인해 주세요.</li><li>한 번 새긴 문신은 원래대로 되돌리기 어려워요.</li><li>레이저 제거는 여러 번 받아야 하고, 비용이 들며 흉터나 자국이 남을 수 있어요.</li><li>글자(레터링)는 철자·띄어쓰기를 한 번 더 확인해 주세요.</li></ul>"],7:["컬러 염료 알레르기","<ul><li>특히 빨강·노랑 계열 염료는 알레르기가 생길 수 있어요.</li><li>시술 직후뿐 아니라 몇 주~몇 달 뒤에 가려움·부어오름·발진이 생기기도 해요.</li><li>알레르기 체질이면 작은 부위에 먼저 시험(패치 테스트)을 요청할 수 있어요.</li><li>증상이 생기면 작업자에게 알리고 피부과 진료를 받아 주세요.</li></ul>"]}},en:{intro:"This form explains possible side effects, complications, aftercare and precautions, and asks for your voluntary consent. Please read it carefully and ask your artist about anything before you decide. Anyone under 19 needs a separate guardian consent form.",s1:"1. Your details",name:"Full name *",birth:"Date of birth (8 digits) *",bph:"YYYYMMDD e.g. 19950512",phone:"Phone *",gender:"Gender",addr:"Address (in Korea or home country) *",emg:"Emergency contact *",enone:"I choose not to give an emergency contact. I understand there may be no one to contact in an emergency. (This choice is recorded with my signature.)",emgwhy:"🔒 This is a required item on the consent form in the Korean Ministry of Health and Welfare's Tattoo Standard Guidelines. We will contact this person only in a real emergency, for example if you faint or become seriously unwell during or right after the tattoo. We will never use it for anything else (no marketing, messages or check-up calls) and will not contact them otherwise. It is kept for the same period as your other details and then deleted.",ename:"Name",ephone:"Phone",erel:"Relationship",sns:"Instagram / SNS (optional, we send your tattoo photos)",visit:"Visit",routeL:"How did you find us? (optional)",s2:"2. Tattoo",s2d:"Your artist filled this in. Please check it is correct.",artist:"Your artist",part:"Body area",date:"Date",design:"Design & size",s3:"3. Health check",s3d:"Answer yes or no to every question. If yes, please add details.",bbnote:"If you have a blood-borne infection, we need a doctor's note before deciding whether to tattoo. Please tell your artist.",hstate:"I have answered truthfully and understand that the tattoo may be refused or stopped for health reasons.",s4:"4. Explanations and consent",s4d:"Tick each item once your artist has explained it and you understand.",copy:"You may ask for a copy of this form. We will not refuse without a valid reason.",sS:"5. About our shared studio",shopi:'BLACKGHOST TATTOO is a shared studio where several <b>independent tattoo artists</b> work in the same space.<ul style="margin:6px 0;padding-left:18px"><li>Your <b>own artist</b> handles and is responsible for the consultation, tattoo, result and aftercare advice, including bookings made or passed on through the studio.</li><li>The studio (owner) provides the space, hygiene facilities and booking help, and meets the duties required of a tattoo business by law (hygiene, records, liability insurance).</li><li>If there is a problem, please contact your artist first. If it is not resolved, you may also contact the studio owner.</li></ul><span class="mu">This notice does not change or limit any responsibility set by law.</span>',shopok:"I understand that my tattoo is performed by, and is the responsibility of, my own artist.",s5:"6. Personal information",photo:"May we post photos of your tattoo on SNS? (Your face will not be shown)",news:"Receive aftercare tips and event messages?",s6:"7. Signature",final:"In accordance with Article 19 of the Tattoo Practitioners Act and Article 18 of its Enforcement Rules, I have received and understood sufficient explanation of the side effects, complications, aftercare and precautions of tattooing, and I voluntarily consent to the tattoo described above.",s6d:"Sign with your finger in the box below.",clear:"Clear",submit:"Agree and submit",thanks:"Submitted. Thank you!",thanksd:"Your artist has received it. You can close this page.",yes:"Yes",no:"No",yA:"Agree",nA:"Disagree",new:"First visit",re:"Returning",detail:"Details (area, year, color, medicine name)",gen:["Prefer not to say","Female","Male","Other"],rel:["Parent","Spouse","Child","Relative","Other"],route:["Naver","Google","Instagram","TikTok","Kakao","Friend","Influencer program","Walk-in","Other"],hq:["Have you had a tattoo before? (area, year)","Have you had problems after a tattoo (inflammation, swelling, skin color change)?","Have you had an allergic reaction to tattoo ink (rash, itching, swelling)? (which color)","Is there a wound, inflammation, rash or other skin problem on the area?","Have you had dermatology treatment in the last 3 months (inflammation, psoriasis, eczema, atopic dermatitis)?","Do your scars swell and turn red (keloids), or does your skin swell or react easily?","Are you allergic to anything (metal, medicine, alcohol, latex)?","Have you been diagnosed with, or are you treated for, a blood-borne infection (hepatitis B or C, HIV/AIDS)?","Have you had seizures or fainting, or do you have epilepsy or another neurological condition?","Are you unwell today (pain, fever, chills, extreme fatigue)?","Are you taking any medication (blood thinners, aspirin, immunosuppressants)? (name)","Have you drunk alcohol in the last 24 hours?","Are you pregnant or breastfeeding?"],dz:"Have you been diagnosed with, or are you treated for, any of these?",dzl:["Stroke","Heart attack / angina","High blood pressure","Diabetes","High cholesterol","Tuberculosis","Other","None"],agree:["I received a full explanation of the tattoo method and process.","I received a full explanation of possible side effects (redness, swelling, pain, itching, blisters, allergy, keloids), complications and aftercare.","I received a full explanation of the precautions before and after tattooing.","I received aftercare instructions and will follow my artist's method.","I am getting this tattoo of my own free will.","I approved the design, size and placement. I understand it is hard to change or undo once finished.","I was told that needles, ink cups and anything touching my skin are sterilized and single-use, and that new packages will be opened in front of me right before tattooing. I can ask to see them.","I was told that colored ink can cause allergic reactions.","Results can vary with skin type and aftercare. I will not hold the artist responsible for problems caused by not following aftercare instructions.","I am 19 years of age or older."],priv:['<b>[Required] Collection and use of personal information</b><br><span class="mu">Items: name, date of birth, gender, phone, address, emergency contact, SNS, signature · Purpose: tattoo records, aftercare, contact · Kept for the period required by law, then deleted</span>','<b>[Required] Collection of health information (sensitive data)</b><br><span class="mu">Items: health check answers · Purpose: deciding whether it is safe to tattoo · Kept for the period required by law, then deleted</span>'],sending:"Sending…",fail:"Could not send. The form may already be submitted or the QR code (30 minutes) may have expired. Check your connection and tap again. If it keeps failing, please tell your artist.",minor:"Anyone under 19 needs a separate guardian consent form. Please tell your artist.",err:"Please fill in the fields marked * (date of birth as 8 digits), answer every health question, tick the required items and sign.",exOpen:"📖 Read explanation",exRead:"✅ Read",exWait:"🙋 Ask your artist to explain",exDemo:"✅ My artist explained it",shHint:"Scroll to the end to enable [I understand].",shHint2:"Finished reading. Tap below if you understand.",shOk:"I understand ✓ Agree",shAsk:"🙋 Ask my artist to explain in person",shX:"Close",ex:{0:["Tattoo method and process","<ul><li><b>Consultation</b>: we agree on the design, size and placement.</li><li><b>Preparation</b>: the area is disinfected and shaved if needed.</li><li><b>Stencil</b>: the design outline is transferred to your skin so you can check the placement.</li><li><b>Tattooing</b>: sterile single-use needles put ink just under the skin surface, usually lines first, then shading and color.</li><li><b>Finish</b>: the area is cleaned again and covered with a protective film.</li></ul>You may feel stinging or soreness. Tell us any time you need a break. Time depends on size and design."],1:["Side effects, complications and aftercare",'<b>Common reactions (usually settle within 1 to 2 weeks)</b><ul><li>Redness, swelling, warmth, oozing: 2 to 3 days</li><li>Itching, flaking, scabs: 1 to 2 weeks. Do not scratch or pick.</li></ul><b>Contact us or see a doctor if</b><ul><li>swelling or pain keeps getting worse, or you have pus or fever (infection)</li><li>a rash or strong itching continues (allergy, which can appear months later)</li></ul><b>Other possible issues</b><ul><li>Keloids (raised scars), ink blowout, fading or patchy color</li><li>Tattoos are permanent. Laser removal takes many sessions and can leave scars.</li></ul><p class="mu">See <b>Aftercare</b> below for how to look after your tattoo.</p>'],3:["Aftercare",'<p class="note">💡 Aftercare <b>differs a little between artists.</b> Some use cream, others use a tattoo patch (clear protective film, often called second skin). <b>Please follow your own artist\'s instructions first.</b></p><b>Basic aftercare</b><ul><li>Wash your hands before touching the area.</li><li>Remove the film or patch at the time your artist tells you.</li><li>Wash gently with lukewarm water and mild soap, then pat dry with a clean towel or tissue.</li><li>Apply only a very thin layer of cream or ointment. Too much slows healing.</li><li>Do not scratch or pick scabs or flakes. Let them fall off on their own.</li></ul><b>For 2 weeks, avoid</b><ul><li>Saunas, public baths, swimming pools and the sea</li><li>Soaking in water (long baths)</li><li>Direct sun and tanning, tight clothes and friction</li><li>Heavy drinking and hard exercise with lots of sweating</li></ul><b>After it heals</b><ul><li>Sun fades tattoos. Use sunscreen when you go out.</li></ul><p class="note">📞 If you have any questions or worries while it heals, <b>contact us any time.</b> Sending a photo helps us answer faster.</p>'],2:["Before and after your tattoo","<b>Before</b><ul><li>No alcohol the d
